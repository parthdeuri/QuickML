slug: bias-variance-tradeoff
title: Bias-Variance Tradeoff
url: https://scikit-learn.org/stable/auto_examples/model_selection/plot_underfitting_overfitting.html
difficulty: Medium
area: Classical ML
topics: [Generalisation, Overfitting, Model Complexity]
summary: |
  Split a model's expected squared error into bias (systematic miss),
  variance (sensitivity to the training sample) and irreducible noise.
intuition: |
  Imagine retraining the same model on many fresh datasets. Bias is how far
  the average prediction sits from the truth; variance is how much single
  predictions scatter around that average. Flexible models shrink the
  first and inflate the second, so test error is U-shaped in complexity.
why_it_works: |
  For a fixed input, expand the squared error around the mean prediction
  E[ŷ]. The cross terms vanish because the noise is independent of the fit
  and the deviation ŷ − E[ŷ] has zero mean, leaving exactly bias², variance
  and noise as three non-negative pieces. Only the first two can be traded
  against each other by changing model complexity.
when_to_use: |
  Use it to diagnose whether a model underfits (high bias, both errors
  high) or overfits (high variance, big train-test gap), and to decide
  between more data, regularisation or a simpler or richer model.
when_not_to_use: |
  The clean decomposition is for squared loss. For 0-1 loss or very
  large over-parameterised networks the classical U-curve can break down
  (double descent), so treat it as intuition rather than a law.
math:
  - "E[(y − ŷ)²] = bias² + variance + σ²"
  - "bias² = (E[ŷ] − f(x))²"
  - "variance = E[(ŷ − E[ŷ])²]"
  - "σ² = noise variance, a floor no model can beat"
  - "Expectation is over training sets D, and over noise in y"
approach:
  - "Pick a known true function f and a test point x0 — so bias can be measured exactly"
  - "Draw many independent noisy training sets — they play the role of 'retraining'"
  - "Fit the model on each and predict at x0 — gives a distribution of predictions"
  - "bias² from the mean prediction versus f(x0) — the systematic part"
  - "variance as the spread of predictions — the instability part"
  - "Sweep model complexity and compare — bias falls while variance rises"
code: |
  import numpy as np

  def bias_variance(f, x0, degree, sigma=0.3, n=30, runs=500, seed=0):
      rng = np.random.default_rng(seed)
      preds = np.empty(runs)
      for r in range(runs):
          x = rng.uniform(-1, 1, n)
          y = f(x) + sigma * rng.normal(size=n)
          coef = np.polyfit(x, y, degree)
          preds[r] = np.polyval(coef, x0)
      bias2 = (preds.mean() - f(x0)) ** 2
      var = preds.var()
      return bias2, var, sigma ** 2
key_lines: [9, 11, 12]
time: "O(runs · n · degree²) for the polynomial fits"
space: "O(runs + n)"
hyperparameters:
  - "Model complexity (polynomial degree, tree depth, k in k-NN)"
  - "Regularisation strength (more shrinkage means more bias, less variance)"
  - "Training set size (more data lowers variance, not bias)"
  - "Number of simulation runs (more runs make the estimates less noisy)"
pitfalls:
  - "Bias and variance cannot be computed on real data because the true f is unknown; only simulation or proxies work"
  - "Too few simulation runs give a noisy variance estimate"
  - "Measured at one x0 only; the trade-off differs across the input space"
interview_qa:
  - q: "How do you recognise high bias versus high variance from learning curves?"
    a: "High bias: train and validation error are both high and close. High variance: train error is low and validation error is much higher, with a large gap."
  - q: "How does regularisation move you along the tradeoff?"
    a: "Stronger regularisation constrains the model, which raises bias and lowers variance."
  - q: "Does more training data fix high bias?"
    a: "No. It reduces variance; a model that is too simple stays wrong however much data it sees."
  - q: "Why can test error never reach zero in this decomposition?"
    a: "The irreducible noise term σ² is part of every noisy target and no model can predict it."
related: [linear-regression, cross-validation]
patterns: ["Regularisation"]
math_tex:
- $E[(y - \hat{y})^2] = \mathrm{bias}^2 + \mathrm{variance} + \sigma^2$
- $\mathrm{bias}^2 = (E[\hat{y}] - f(x))^2$
- $\mathrm{variance} = E[(\hat{y} - E[\hat{y}])^2]$
- $\sigma^2$ = noise variance, a floor no model can beat
- Expectation over training sets $D$ and noise in $y$
