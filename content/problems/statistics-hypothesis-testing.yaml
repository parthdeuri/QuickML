time: "O(n) for the t-test, O(B·n) for the bootstrap, O(m log m) for BH (sort), O(m) for Bonferroni"
space: "O(B·n) for the resampled indices, O(m) for the p-values"
hyperparameters:
  - 'Significance level $\alpha$ — tolerated false-positive rate (or FDR for BH)'
  - 'Number of bootstrap resamples $B$ — more resamples give smoother interval ends'
  - 'Number of tests $m$ — sets the Bonferroni threshold and the BH line'
  - 'Two-sided or one-sided alternative — fixed before looking at the data'
pitfalls:
  - 'A $p$-value is not the probability that the null is true, and "not significant" is not evidence that there is no effect (low power looks the same)'
  - 'Testing many hypotheses and reporting only the significant ones inflates false positives; correct across the whole family'
  - 'BH guarantees hold for independent or positively dependent tests; Bonferroni controls the chance of any false rejection and is more conservative'
  - 'The percentile bootstrap undercovers for small samples and for statistics that depend on the extremes'
interview_qa:
  - q: 'What does a p-value mean?'
    a: 'The probability, under the null hypothesis, of a test statistic at least as extreme as the one observed. It is not the probability that the null is true or that the result is a fluke.'
  - q: 'What are Type I and Type II errors, and power?'
    a: 'Type I is rejecting a true null, with probability $\alpha$. Type II is missing a real effect, with probability $\beta$. Power is $1-\beta$, the chance of detecting a real effect, and it grows with sample size and effect size.'
  - q: 'Why use Welch over the pooled t-test?'
    a: 'It does not assume equal variances and loses little when they are equal, so it is a safe default with unequal group sizes or spreads.'
  - q: 'Bonferroni versus Benjamini-Hochberg?'
    a: 'Bonferroni controls the probability of any false positive by testing each at $\alpha/m$. BH controls the expected fraction of false discoveries among rejections, which is less strict and has more power when many effects are real.'
