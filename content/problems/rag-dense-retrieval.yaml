time: "O(N·d) to score N chunks of dimension d by brute force; approximate indexes reduce this at some recall cost"
space: "O(N·d) for the chunk embedding matrix"
hyperparameters:
  - "Chunk size and overlap"
  - "Number of retrieved chunks k"
  - "Embedding model and dimension (a hashing stand-in here)"
  - "Similarity (cosine on normalised vectors, or dot product)"
  - "Exact versus approximate nearest-neighbour index"
pitfalls:
  - "The embedding here is a signed hashing bag of words, so it only matches shared words; it has no semantic understanding, unlike a trained embedding model"
  - "Embedding the chunks inside retrieve is for brevity; real systems embed once and store the matrix"
  - "Chunk by words here for simplicity; production systems chunk by tokens or sentences and keep metadata"
  - "Query and chunks must use the same embedding model and normalisation"
interview_qa:
  - q: "Why use overlapping chunks?"
    a: "Information near a chunk boundary would be split across two chunks and could be missed by both. Overlap repeats boundary text so at least one chunk contains the whole passage, at the cost of a larger index."
  - q: "Why normalise embeddings before search?"
    a: "For unit vectors the dot product equals cosine similarity, so exact search is a single matrix product and magnitude differences cannot affect the ranking."
  - q: "What are the trade-offs of exact versus approximate nearest-neighbour search?"
    a: "Exact search is simple and gives the true top-k but scales linearly with corpus size. Approximate indexes such as graph or clustering based ones are much faster on large corpora but can miss true neighbours."
