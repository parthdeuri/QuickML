time: "ROUGE-N O(m + n); ROUGE-L O(m·n) for candidate length m and reference length n"
space: "O(m·n) for the LCS table (O(min(m, n)) with a rolling row)"
hyperparameters:
  - "N-gram order N (ROUGE-1 and ROUGE-2 are most common)"
  - "Variant (ROUGE-N, ROUGE-L sentence level, ROUGE-Lsum summary level)"
  - "Stemming and stop-word handling"
  - "Which statistic to report: precision, recall or F1"
pitfalls:
  - "Tokenisation and stemming change the score; use one package for all systems"
  - "This ROUGE-L is sentence level; the summary-level ROUGE-Lsum splits sentences and unions LCS matches"
  - "This code takes one reference and tokens already split, lower-cased and unstemmed"
  - "High overlap does not imply factual correctness or fluency"
interview_qa:
  - q: "Why is ROUGE recall-oriented while BLEU is precision-oriented?"
    a: "Summarisation asks whether the key reference content was captured, which is recall. Translation asks whether what was produced is correct, which is precision, with a brevity penalty. Modern ROUGE reports all three."
  - q: "How does ROUGE-L differ from ROUGE-2?"
    a: "ROUGE-2 needs adjacent word pairs to match exactly. ROUGE-L uses the longest common subsequence, so matched words must be in the same order but may have other words between them."
  - q: "How is the longest common subsequence computed?"
    a: "Dynamic programming over prefixes: if the last words match, extend the diagonal cell by one; otherwise take the larger of dropping the last word of either sequence."
