slug: metropolis-hastings
title: Metropolis-Hastings Sampling
url: https://en.wikipedia.org/wiki/Metropolis%E2%80%93Hastings_algorithm
difficulty: Hard
area: Math
topics: [MCMC, Sampling, Bayesian Inference, Markov Chains]
summary: |
  Draw samples from a distribution known only up to a constant by running
  a Markov chain that proposes random moves and accepts them with a
  probability that favours higher density.
intuition: |
  You can evaluate how probable a point is relative to another, but you
  cannot sample from the distribution directly. Wander randomly: propose a
  nearby point, always move uphill in density, and move downhill only with
  probability equal to the density ratio. Time spent at each place then
  ends up proportional to its probability, and the unknown normalising
  constant cancels because only ratios appear.
why_it_works: |
  The acceptance rule is chosen so the chain satisfies detailed balance
  with respect to the target: probability flow from x to y equals flow
  from y to x at stationarity. Detailed balance implies the target is the
  stationary distribution, and with an irreducible aperiodic chain the
  samples converge to it. Consecutive samples are correlated, so the
  effective sample size is smaller than the number of draws.
when_to_use: |
  Bayesian posteriors with unnormalised densities, low-dimensional
  problems with no conjugate form, and as the base for HMC and Gibbs-style
  samplers.
when_not_to_use: |
  High dimensions or strongly correlated, multimodal targets, where random
  walks mix very slowly (use HMC/NUTS or variational inference), or when a
  direct sampler or a deterministic integrator is available.
math:
  - "Target: π(x) ∝ p(x), normaliser unknown"
  - "Proposal: y ~ q(y|x), here symmetric y = x + σ ε, ε ~ N(0,1)"
  - "Accept: a(x→y) = min(1, p(y) q(x|y) / (p(x) q(y|x)))"
  - "Symmetric q: a = min(1, p(y)/p(x))"
  - "Log form: accept if log u < log p(y) − log p(x), u ~ U(0,1)"
  - "Detailed balance: π(x) q(y|x) a(x→y) = π(y) q(x|y) a(y→x)"
approach:
  - "Start at an initial point and evaluate its log density — logs avoid underflow"
  - "Propose a Gaussian step from the current point — a symmetric random-walk move"
  - "Compute the log density ratio of proposal to current — the normaliser cancels"
  - "Accept if log u is below the ratio, otherwise stay — uphill is always taken, downhill sometimes"
  - "Record the current state every iteration, including repeats — rejected moves must be counted"
  - "Discard a burn-in and check the acceptance rate — too high means tiny steps, too low means huge ones"
code: |
  import numpy as np

  def metropolis(logp, x0, n, step, seed=0):
      rng = np.random.default_rng(seed)
      x, lp = x0, logp(x0)
      out, acc = np.empty(n), 0
      for i in range(n):
          y = x + step * rng.normal()
          lq = logp(y)
          if np.log(rng.random()) < lq - lp:
              x, lp = y, lq
              acc += 1
          out[i] = x
      return out, acc / n
key_lines: [8, 10, 11]
time: "O(n) target evaluations for n iterations"
space: "O(n) for stored samples (O(1) if only running statistics are kept)"
hyperparameters:
  - "Proposal step size σ — tune for a moderate acceptance rate"
  - "Burn-in length — samples discarded before the chain is near stationary"
  - "Number of iterations n and thinning — set by effective sample size"
  - "Starting point and number of chains — several chains diagnose non-convergence"
pitfalls:
  - "This is a 1-D random walk with a symmetric proposal; asymmetric proposals need the Hastings correction"
  - "Tiny steps accept almost everything but explore slowly; huge steps are mostly rejected"
  - "Samples are autocorrelated, so naive standard errors are too small"
  - "A single chain can look converged while stuck in one mode; run several and compare"
interview_qa:
  - q: "Why does the normalising constant not matter?"
    a: "The acceptance probability depends only on the ratio p(y)/p(x), in which the unknown constant cancels."
  - q: "What is detailed balance and why does it matter?"
    a: "It says stationary probability flow x to y equals y to x; any chain satisfying it with respect to π has π as a stationary distribution, which is the correctness condition."
  - q: "How do you choose the proposal step size?"
    a: "Tune it so the acceptance rate is moderate, neither near zero nor near one; both extremes give highly autocorrelated samples."
  - q: "How does Metropolis-Hastings differ from Gibbs sampling?"
    a: "Gibbs draws each variable from its exact conditional and always accepts; Metropolis-Hastings proposes from any distribution and corrects with an accept-reject step, so it needs no conditionals."
related: [bayes-theorem, maximum-likelihood, entropy-kl-divergence]
patterns: ["Probabilistic models"]
