time: "O(N) per evaluation for N samples (the policy network dominates the real cost)"
space: "O(N) for the ratios and advantages"
hyperparameters:
  - "Clip range ε (smaller is more conservative)"
  - "Number of epochs and minibatches per batch of data"
  - "Advantage estimator settings (γ and λ) and normalisation"
  - "Value-loss and entropy coefficients when added to the objective"
pitfalls:
  - "Clipping bounds the gradient incentive, not the actual policy change; large steps can still overshoot the band"
  - "Advantages are usually normalised per batch; the sign of Â decides which side of the band is clipped"
  - "Log-probs must be from the policy that sampled the actions and be stored detached"
  - "This is only the policy term; real PPO adds a value-function loss and an entropy bonus, and usually early-stops on KL"
interview_qa:
  - q: "Why take the minimum of the clipped and unclipped terms?"
    a: "It makes the objective a lower bound on the unclipped surrogate. Improvements beyond the clip band are not rewarded, while moves in the harmful direction keep their full gradient."
  - q: "When is the gradient zero?"
    a: "For a positive advantage when the ratio is above 1 plus ε, and for a negative advantage when the ratio is below 1 minus ε. In those regions the clipped term is a constant."
  - q: "How does PPO relate to TRPO?"
    a: "Both limit how far the policy moves per update. TRPO enforces a KL constraint with second-order optimisation, while PPO uses a first-order clipped objective that is simpler to implement."
related: [reinforce-policy-gradient, gae-advantage, entropy-kl-divergence]
patterns: ["Reinforcement learning", "Preference alignment and policy gradients"]
math_tex:
- 'Ratio: $\rho = \frac{\pi_{new}(a|s)}{\pi_{old}(a|s)} = \exp(\mathrm{logp}_{new} - \mathrm{logp}_{old})$'
- 'Unclipped: $\rho\cdot\hat{A}$'
- 'Clipped: $\mathrm{clip}(\rho,\ 1-\epsilon,\ 1+\epsilon)\cdot\hat{A}$'
- $L_{CLIP} = \mathrm{mean}\left[\min\left(\rho\hat{A},\ \mathrm{clip}(\rho, 1-\epsilon, 1+\epsilon)\hat{A}\right)\right]$
- Loss to minimise $= -L_{CLIP}$
- $\frac{\partial L_{CLIP}}{\partial\,\mathrm{logp}_{new}} = \rho\hat{A}$ if unclipped is the min, else 0
- '$\hat{A} > 0$: gradient stops once $\rho > 1 + \epsilon$'
- '$\hat{A} < 0$: gradient stops once $\rho < 1 - \epsilon$'
