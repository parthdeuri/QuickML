time: "HyDE adds one LLM generation plus one embedding per query; multi-query costs one search per paraphrase"
space: "O(N·d) for the corpus vectors; fusion keeps only a score per seen document"
hyperparameters:
  - "Number of paraphrases or hypothetical documents"
  - "Generator prompt and sampling temperature"
  - "RRF constant $k$ (60 is common)"
  - "Number of results k per list"
pitfalls:
  - "A hallucinated hypothetical document can pull retrieval to the wrong place, so check it against the original query or fuse it with plain query results"
  - "HyDE adds an LLM call of latency and cost before every search"
  - "The generator here is a stub; a real one makes results vary run to run unless temperature is zero"
  - "Rewriting from chat history must keep the user's intent; an over-eager rewrite can drop a constraint"
interview_qa:
  - q: "Why embed a fake answer instead of the question?"
    a: "Documents look like answers, not questions. The hypothetical text is document-shaped, so its embedding falls near real relevant documents even when its facts are wrong."
  - q: "Why use ranks instead of scores when fusing multi-query results?"
    a: "Scores from different queries are not on a common scale. Ranks are, and reciprocal rank fusion needs no tuning beyond the constant $k$."
  - q: "What does query rewriting from chat history fix?"
    a: "A follow-up such as 'how much does it cost?' has no standalone meaning. Rewriting resolves pronouns and context into a self-contained query before retrieval."
  - q: "When does HyDE hurt?"
    a: "When the generator is wrong about the topic, the hypothetical text points to the wrong neighbourhood. It also adds latency and cost."
