time: "O(total characters) for parsing and cleaning; the repeated-line pass is one hash-table count over all lines"
space: "O(distinct lines) for the repeat counter plus the cleaned text"
hyperparameters:
  - "min_frac, the page fraction above which a line counts as boilerplate"
  - "Set of tags to skip and tags that mark block boundaries"
  - "Unicode normalisation form (NFKC versus NFC)"
  - "Metadata fields to keep (source, page, section, date)"
pitfalls:
  - "Digits are masked when counting so that Page 1, Page 2 match, which also merges unique lines that differ only by a number"
  - "A low min_frac on a short document deletes real content; a short repeated line is only boilerplate if it appears on most pages"
  - "NFKC changes meaning for some text, for example it turns superscript digits into ordinary ones, so keep the raw text if exact quotes matter"
  - "PDFs, scanned pages and tables need dedicated parsers or OCR; these rules do not fix reading order or merged columns"
interview_qa:
  - q: "Why clean text before embedding?"
    a: "Boilerplate and broken text add shared noise to chunk vectors, which makes unrelated chunks look similar and lowers retrieval precision. Clean input also gives stable tokenisation."
  - q: "How do you detect repeated headers and footers without layout analysis?"
    a: "Count how many pages each distinct line appears on and drop lines whose page fraction passes a threshold, masking digits so page numbers still match."
  - q: "Why attach metadata to every chunk?"
    a: "After chunking, a chunk no longer knows where it came from. Source, page and section let the system cite answers and filter retrieval by document, date or access level."
  - q: "What is the hardest part of document loading in practice?"
    a: "Non-HTML formats. PDFs, scans and tables lose reading order and structure on extraction, so they need layout-aware parsers or OCR and careful checking."
