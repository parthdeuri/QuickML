id: compare-mse-vs-cross-entropy
name: 'Compare: Squared error vs Cross-entropy'
order: 111
summary: Both are losses; squared error suits real-valued targets, cross-entropy
  suits class probabilities.
when_to_use:
- Pick squared error for regression with roughly Gaussian noise.
- Pick cross-entropy for classification with softmax or sigmoid outputs.
- Avoid squared error on probabilities, because its gradient vanishes when the output
  saturates.
key_idea: Squared error is the negative log-likelihood of Gaussian noise, and cross-entropy
  is the negative log-likelihood of a categorical label. With a sigmoid or softmax
  output, the gradient of cross-entropy with respect to the logits is simply prediction
  minus target, while squared error's gradient is damped by the saturating output.
template: |
  import numpy as np

  def mse(pred, y):
      return ((pred - y) ** 2).mean()

  def cross_entropy(logits, y):
      z = logits - logits.max(-1, keepdims=True)
      logp = z - np.log(np.exp(z).sum(-1, keepdims=True))
      return -logp[np.arange(len(y)), y].mean()
complexity: Both are O(n) in the number of examples (times classes for cross-entropy).
pitfalls:
- Compute log-softmax with log-sum-exp, not log(softmax).
- Class imbalance may call for class weights or focal loss on top of cross-entropy.
problems:
- softmax-cross-entropy
- linear-regression
- maximum-likelihood
aliases:
- 'Compare: Squared error vs Cross-entropy'
