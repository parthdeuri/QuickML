slug: local-outlier-factor
title: Local Outlier Factor
url: https://scikit-learn.org/stable/modules/outlier_detection.html#local-outlier-factor
difficulty: Medium
area: Classical ML
topics: [Anomaly Detection, Unsupervised, Density Estimation, Nearest Neighbors]
summary: |
  Score each point by comparing its local density with the density around
  its $k$ nearest neighbours. A score near one means a point is as dense as
  its surroundings; a much larger score marks a local outlier.
intuition: |
  A point can be far from everything in absolute terms and still be normal
  if it sits in a naturally sparse region. What makes a point odd is being
  sparser than the neighbours it belongs to, so the score is a ratio of
  the neighbours' density to the point's own density rather than a raw
  distance.
why_it_works: |
  The reachability distance smooths density estimates by flooring each
  distance at the neighbour's own $k$-distance, so points inside a cluster
  get stable, comparable densities. Dividing the neighbours' average
  density by the point's density normalises away the cluster's overall
  scale, which makes clusters of different density comparable.
when_to_use: |
  Anomalies defined relative to local context, data with clusters of
  differing density, and unsupervised outlier ranking where no labels
  exist.
when_not_to_use: |
  Skip it when outliers are global extremes (simple distance or
  isolation forest is cheaper), in high dimensions where distances lose
  contrast, and for large n without a neighbour index.
math:
  - "k-dist(o) = distance from o to its k-th nearest neighbour"
  - "reach(p, o) = max(k-dist(o), d(p, o))"
  - "lrd(p) = 1 / mean over o ∈ N_k(p) of reach(p, o)"
  - "LOF(p) = mean over o ∈ N_k(p) of lrd(o) / lrd(p)"
  - "LOF ≈ 1 inlier, LOF ≫ 1 outlier"
approach:
  - "Compute pairwise distances and set the self distance to infinity — a point is not its own neighbour"
  - "Take the $k$ nearest neighbours of each point and the distance to the $k$-th — the $k$-distance defines the neighbourhood scale"
  - "Form reachability distances with the floor at the neighbour's $k$-distance — smooths out noise inside dense clusters"
  - "Invert the mean reachability to get a local density — high when neighbours are close"
  - "Divide the neighbours' mean density by the point's own — a ratio above one means sparser than the neighbourhood"
code: |
  import numpy as np

  def lof(X, k):
      D = np.sqrt(((X[:, None] - X[None]) ** 2).sum(-1))
      np.fill_diagonal(D, np.inf)
      nb = np.argsort(D, axis=1, kind="stable")[:, :k]
      dk = np.take_along_axis(D, nb, 1)
      reach = np.maximum(dk[nb, -1], dk)
      lrd = 1 / (reach.mean(1) + 1e-10)
      return lrd[nb].mean(1) / lrd
key_lines: [8, 9, 10]
time: "O(n²·d) here from the full distance matrix; spatial indexes make neighbour search faster in low dimensions"
space: "O(n²) for the distance matrix, O(n·k) for neighbour lists"
hyperparameters:
  - "n_neighbors $k$ — larger smooths the score, small is noisy and sensitive to tiny clusters"
  - "Distance metric — Euclidean by default, scale features first"
  - "Contamination — fraction flagged when a hard threshold is needed"
pitfalls:
  - "Features on different scales make the distance, and so the score, meaningless"
  - "Duplicate points give zero reachability distance, so a tiny constant avoids dividing by zero"
  - "Ties at the $k$-th distance make the neighbour set depend on tie-breaking"
  - "Scores are relative to $k$; there is no universal threshold above 1"
interview_qa:
  - q: "Why is LOF a local method?"
    a: "It compares a point's density with that of its own neighbours instead of the global average, so a point in a sparse cluster is not flagged just because the whole cluster is sparse."
  - q: "What does the reachability distance do?"
    a: "It replaces the true distance by the larger of the true distance and the neighbour's $k$-distance, which stops very close pairs from producing wildly large densities."
  - q: "How do you choose $k$?"
    a: "Use at least the size of the smallest group you would still call a cluster; larger $k$ smooths the scores, and ranking stability across a range of $k$ is a useful check."
related: [knn, dbscan, k-means]
patterns: ["Distance and clustering"]
math_tex:
- $k$-$\mathrm{dist}(o)$ = distance from $o$ to its $k$-th neighbour
- $\mathrm{reach}(p, o) = \max(\mathrm{kdist}(o),\ d(p, o))$
- $\mathrm{lrd}(p) = \frac{1}{\mathrm{mean}_{o \in N_k(p)}\ \mathrm{reach}(p, o)}$
- $\mathrm{LOF}(p) = \frac{\mathrm{mean}_{o \in N_k(p)}\ \mathrm{lrd}(o)}{\mathrm{lrd}(p)}$
- $\mathrm{LOF} \approx 1$ inlier, $\mathrm{LOF} \gg 1$ outlier
