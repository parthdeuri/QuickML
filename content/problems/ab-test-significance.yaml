slug: ab-test-significance
title: A/B Test Significance (Two-Proportion z-Test)
url: https://en.wikipedia.org/wiki/Two-proportion_Z-test
difficulty: Medium
area: MLOps
topics: [Experimentation, Hypothesis Testing, A/B Testing, Statistics]
summary: |
  Decide whether two conversion rates differ by more than chance with a
  pooled two-proportion z-test, and plan how many users each arm needs
  before the experiment starts.
intuition: |
  Under the null hypothesis both arms share one true rate, so the
  observed gap is just sampling noise whose size is known from the
  binomial variance. Dividing the gap by that noise gives a z-score that
  says how many standard errors apart the arms are. Sample size works the
  other way round: the smaller the effect you want to detect, the more
  users you need, growing with the inverse square of that effect.
why_it_works: |
  For large samples the sample proportions are approximately normal by
  the central limit theorem, so the standardised difference is
  approximately standard normal under the null. The pooled rate estimates
  the common variance under that null. The sample-size formula comes from
  requiring the gap to clear the critical value under the null while still
  being detected with the desired power under the alternative.
when_to_use: |
  Comparing binary outcomes such as clicks or conversions between a
  control and a treatment with independent users, enough successes and
  failures in each arm, and a fixed analysis time decided in advance.
when_not_to_use: |
  Small counts (use Fisher's exact test), continuous metrics (use a t-test
  or bootstrap), repeated peeking at results without a sequential method,
  or users that are not independent (clustering, network effects).
math:
  - "p̂₁ = x₁/n₁,  p̂₂ = x₂/n₂,  pooled p̂ = (x₁+x₂)/(n₁+n₂)"
  - "Null SE: √( p̂(1−p̂)(1/n₁ + 1/n₂) )"
  - "z = (p̂₂ − p̂₁) / SE_null"
  - "Two-sided p-value: p = 2(1 − Φ(|z|)) = erfc(|z|/√2)"
  - "CI: (p̂₂−p̂₁) ± z_{α/2} √( p̂₁(1−p̂₁)/n₁ + p̂₂(1−p̂₂)/n₂ )"
  - "Per-arm n = (z_{α/2}+z_β)² [p₁(1−p₁)+p₂(1−p₂)] / δ²"
  - "δ = p₂ − p₁ is the minimum detectable effect"
approach:
  - "Compute each arm's observed rate and the pooled rate — the pooled rate is the estimate under the null"
  - "Form the standard error with the pooled variance — the noise expected if there is no true difference"
  - "Divide the observed difference by it to get z — how many standard errors apart the arms are"
  - "Convert z to a two-sided p-value with the normal tail — evidence against the null"
  - "Report a confidence interval with unpooled variance — shows the plausible size of the effect, not just significance"
  - "Before the test, size each arm from the minimum detectable effect, significance and power — avoids underpowered experiments"
code: |
  from math import ceil, erfc, sqrt

  def two_prop_z(x1, n1, x2, n2):
      p1, p2 = x1 / n1, x2 / n2
      p = (x1 + x2) / (n1 + n2)
      se = sqrt(p * (1 - p) * (1 / n1 + 1 / n2))
      z = (p2 - p1) / se
      pval = erfc(abs(z) / sqrt(2))
      se_d = sqrt(p1 * (1 - p1) / n1 + p2 * (1 - p2) / n2)
      ci = (p2 - p1 - 1.96 * se_d, p2 - p1 + 1.96 * se_d)
      return z, pval, ci

  def sample_size(p, delta, za=1.96, zb=0.84):
      var = p * (1 - p) + (p + delta) * (1 - p - delta)
      return ceil((za + zb) ** 2 * var / delta ** 2)
key_lines: [6, 7, 8]
time: "O(1) for the test and the sample-size formula"
space: "O(1)"
hyperparameters:
  - "Significance level α — false-positive rate allowed (two-sided here)"
  - "Power 1−β — chance of detecting the minimum effect"
  - "Minimum detectable effect δ — smallest change worth detecting"
  - "Baseline rate p — needed for the variance"
pitfalls:
  - "Peeking and stopping when p dips below α inflates false positives; fix the sample size or use sequential tests"
  - "The normal approximation needs enough successes and failures in each arm"
  - "Testing many metrics or variants without correction raises the chance of a false win"
  - "The constants 1.96 and 0.84 are rounded critical values for α=0.05 two-sided and 80% power; pass other values for other settings, and check the interval for practical size, not just significance"
interview_qa:
  - q: "What does a p-value mean in an A/B test?"
    a: "It is the probability of seeing a difference at least this large if the two arms truly had the same rate; it is not the probability that the treatment is better."
  - q: "Why pool the rates for the test statistic?"
    a: "The null hypothesis says there is one common rate, so the pooled estimate is the best variance estimate under that null; the confidence interval uses unpooled variances because it describes the actual difference."
  - q: "What happens if you peek at the results every day?"
    a: "Each look is another chance for a spurious significant result, so the overall false-positive rate rises well above α; use a fixed horizon or a sequential or alpha-spending design."
  - q: "How does sample size scale with effect size?"
    a: "Inversely with the square of the minimum detectable effect, so detecting half the effect needs about four times as many users."
related: [bayes-theorem, cross-validation, concept-drift]
patterns: ["Validation hygiene"]
math_tex:
- $\hat{p}_1 = \frac{x_1}{n_1},\;\; \hat{p}_2 = \frac{x_2}{n_2},\;\; \hat{p} = \frac{x_1+x_2}{n_1+n_2}$
- 'Null SE: $\sqrt{\hat{p}(1-\hat{p})\left(\frac{1}{n_1} + \frac{1}{n_2}\right)}$'
- $z = \frac{\hat{p}_2 - \hat{p}_1}{\mathrm{SE}_{null}}$
- 'Two-sided p-value: $p = 2(1 - \Phi(|z|)) = \mathrm{erfc}(|z|/\sqrt{2})$'
- 'CI: $(\hat{p}_2-\hat{p}_1) \pm z_{\alpha/2}\sqrt{\frac{\hat{p}_1(1-\hat{p}_1)}{n_1} + \frac{\hat{p}_2(1-\hat{p}_2)}{n_2}}$'
- $n = \frac{(z_{\alpha/2}+z_\beta)^2\,[p_1(1-p_1)+p_2(1-p_2)]}{\delta^2}$ per arm
- $\delta = p_2 - p_1$ is the minimum detectable effect
