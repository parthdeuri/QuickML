id: transfer-and-adaptation
name: Transfer and adaptation
order: 18
summary: Reuse a trained model by fine-tuning it cheaply or compressing it into
  a smaller one.
when_to_use:
- You have little data for the target task.
- A large pretrained model exists for a related domain.
- You must fit a model into a small memory or latency budget.
key_idea: Pretrained weights already encode useful features, so train only a small
  part (a head or low-rank update) or let a small student imitate the big teacher's
  outputs. You keep most of the accuracy for a fraction of the cost.
template: |
  import numpy as np

  def lora_forward(x, W, A, B, alpha, r):
      return x @ W + (alpha / r) * (x @ A) @ B   # W frozen

  def distill_loss(student_logits, teacher_logits, T=2.0):
      def sm(z):
          e = np.exp((z - z.max(-1, keepdims=True)) / T)
          return e / e.sum(-1, keepdims=True)
      p, q = sm(teacher_logits), sm(student_logits)
      return np.sum(p * (np.log(p) - np.log(q)), -1).mean() * T * T
complexity: LoRA trains O(r·(d_in + d_out)) parameters per layer instead of O(d_in·d_out).
pitfalls:
- Fine-tuning with too large a learning rate destroys pretrained features.
- A student cannot exceed what the teacher's outputs reveal.
