name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels an older build that is still
# queued or running, so only the latest version gets built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install content pipeline deps
        run: pip install -r content/requirements.txt

      - name: Build problems.json
        run: python content/scripts/build.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare signing key
        env:
          QUICKML_KEYSTORE_BASE64: ${{ secrets.QUICKML_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QUICKML_KEYSTORE_BASE64" ]; then
            echo "$QUICKML_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quickml.p12"
            echo "QUICKML_KEYSTORE_PATH=$RUNNER_TEMP/quickml.p12" >> "$GITHUB_ENV"
            echo "Signing with the stable key"
          else
            echo "::warning::No signing secrets - using a temporary debug key"
          fi

      - name: Assemble release APK
        env:
          QUICKML_KEYSTORE_PASSWORD: ${{ secrets.QUICKML_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quickml-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
