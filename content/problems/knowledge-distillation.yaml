slug: knowledge-distillation
title: Knowledge Distillation
url: https://docs.pytorch.org/docs/stable/generated/torch.nn.KLDivLoss.html
difficulty: Medium
area: Deep Learning
topics: [Model Compression, Temperature, KL Divergence]
summary: |
  Train a small student to match the softened output distribution of a
  large teacher, in addition to the true labels.
intuition: |
  A teacher's probabilities say more than the label: a cat image that
  gets some probability on dog and almost none on truck reveals which
  classes look alike. Raising the softmax temperature flattens the
  distribution so these small probabilities become visible and
  learnable. The student then learns the teacher's similarity
  structure, not just the right answer.
why_it_works: |
  Soft targets carry far more information per example than one-hot
  labels, giving a richer gradient signal and acting as a regulariser.
  Multiplying the soft loss by $T^2$ keeps its gradient magnitude
  comparable to the hard-label loss as the temperature changes, since
  gradients through the softened softmax scale like $1/T^2$.
when_to_use: |
  Compressing a large model or ensemble into a smaller one for
  deployment, or when unlabelled data can be labelled by a teacher.
when_not_to_use: |
  When no accurate teacher exists, or the student has too little
  capacity to follow it, where extra soft-target weight gives little
  benefit.
math:
  - "p_T(z)_k = exp(z_k / T) / Σ_j exp(z_j / T)"
  - "Soft loss: KL(p_T(z_teacher) ‖ p_T(z_student))"
  - "Hard loss: CE(softmax(z_student), y)"
  - "L = (1 − α)·hard + α·T²·soft"
approach:
  - "Compute teacher and student log-probabilities at temperature $T$ — exposes the small class probabilities"
  - "Compute the KL divergence from teacher to student, averaged over the batch — measures mismatch of the soft distributions"
  - "Compute the ordinary cross-entropy of the student at $T = 1$ — keeps the student anchored to the labels"
  - "Mix the two with weight $\\alpha$ and scale the soft term by $T^2$ — balances gradient sizes across temperatures"
code: |
  import numpy as np

  def log_softmax(z, T=1.0):
      z = z / T
      z = z - z.max(1, keepdims=True)
      return z - np.log(np.exp(z).sum(1, keepdims=True))

  def distill_loss(s, t, y, T=2.0, alpha=0.5):
      lps, lpt = log_softmax(s, T), log_softmax(t, T)
      kl = (np.exp(lpt) * (lpt - lps)).sum(1).mean()
      hard = -log_softmax(s)[np.arange(len(y)), y].mean()
      return (1 - alpha) * hard + alpha * T * T * kl
key_lines: [9, 10, 12]
time: "O(N·K) per batch, plus the teacher's forward pass"
space: "O(N·K) for the log-probabilities"
hyperparameters:
  - "Temperature $T$"
  - "Mixing weight $\\alpha$ between soft and hard loss"
  - "Student size relative to the teacher"
  - "Whether the teacher's logits are precomputed"
pitfalls:
  - "Forgetting the $T^2$ factor makes the soft term vanish at high temperature"
  - "Teacher gradients must not flow; use its outputs as fixed targets"
  - "The teacher must be in eval mode so dropout does not add noise"
  - "This is the logit-matching form; feature and attention distillation are not covered"
interview_qa:
  - q: "Why use a temperature?"
    a: "It flattens the teacher's distribution so the small probabilities on wrong classes become a usable training signal."
  - q: "Why multiply the soft loss by $T^2$?"
    a: "Gradients through the softened softmax scale like $1/T^2$, so $T^2$ keeps the soft and hard terms comparable."
  - q: "Which direction of KL is used?"
    a: "$\\mathrm{KL}(\\mathrm{teacher} \\,\\|\\, \\mathrm{student})$, so the student covers the classes the teacher considers likely."
related: [softmax-cross-entropy, entropy-kl-divergence, label-smoothing]
