id: classification-metrics
name: Classification metrics
order: 7
summary: Summarise a classifier's errors with numbers chosen for the cost of each
  mistake.
when_to_use:
- Classes are imbalanced and accuracy hides failures.
- Missing a positive costs more than a false alarm, or the reverse.
- You must compare models independent of a threshold.
key_idea: Accuracy counts all errors equally. Precision, recall and F1 expose the
  trade-off at one threshold, ROC-AUC summarises all thresholds, and calibration
  asks whether the probabilities mean what they say.
template: |
  import numpy as np

  def prf(y, yhat):
      tp = np.sum((y == 1) & (yhat == 1))
      fp = np.sum((y == 0) & (yhat == 1))
      fn = np.sum((y == 1) & (yhat == 0))
      p = tp / max(tp + fp, 1)
      r = tp / max(tp + fn, 1)
      return p, r, 2 * p * r / max(p + r, 1e-12)
complexity: O(n) per threshold; AUC needs a sort, O(n log n).
pitfalls:
- ROC-AUC looks optimistic on heavily imbalanced data.
- Picking the threshold on the test set leaks information.
problems:
- precision-recall-f1
- roc-auc
- probability-calibration
- class-imbalance
- multiclass-metrics
aliases:
- Classification metrics
