slug: adam-optimizer
title: Adam Optimizer
url: https://docs.pytorch.org/docs/stable/generated/torch.optim.Adam.html
difficulty: Medium
area: Deep Learning
topics: [Optimisation, Adaptive Learning Rates, Momentum]
summary: |
  Gradient descent that keeps running averages of the gradient and its
  square, and scales each parameter's step by the inverse of the
  gradient's recent size.
intuition: |
  The first moment smooths noisy gradients like momentum, while the
  second moment gives each parameter its own step size, so weights with
  small gradients take larger steps and volatile ones take smaller
  steps. Bias correction fixes the zero start of the averages so the
  first steps are not artificially small.
why_it_works: |
  Dividing by the root of the second moment makes the update roughly
  scale-invariant to the gradient magnitude, so one learning rate works
  across layers with very different gradient sizes. The averages
  start at zero and are therefore biased low early on; dividing by
  $(1-\beta^t)$ removes that bias.
when_to_use: |
  Default optimiser for deep networks, transformers and problems with
  sparse or noisy gradients, where it needs little tuning.
when_not_to_use: |
  Plain SGD with momentum can generalise better on some vision tasks,
  and when weight decay is wanted, prefer AdamW, which decouples decay
  from the adaptive step.
math:
  - "m ← β₁m + (1 − β₁)g"
  - "v ← β₂v + (1 − β₂)g²"
  - "m̂ = m / (1 − β₁ᵗ),  v̂ = v / (1 − β₂ᵗ)"
  - "w ← w − η · m̂ / (√v̂ + ε)"
  - "Defaults: β₁ = 0.9, β₂ = 0.999, ε = 1e-8"
approach:
  - "Keep $m$, $v$ (zeros) and a step counter $t$ per parameter — the state that makes steps adaptive"
  - "Update $m$ as a moving average of the gradient — smooths direction like momentum"
  - "Update $v$ as a moving average of the squared gradient — tracks per-parameter scale"
  - "Bias-correct both with $1-\\beta^t$ — undoes the zero initialisation"
  - "Step by $\\eta\\,\\hat{m}/(\\sqrt{\\hat{v}}+\\epsilon)$ — a normalised step whose size is roughly η"
code: |
  import numpy as np

  def init_state(w):
      return {"m": np.zeros_like(w), "v": np.zeros_like(w), "t": 0}

  def adam_step(w, g, st, lr=1e-3, b1=0.9, b2=0.999, eps=1e-8):
      st["t"] += 1
      st["m"] = b1 * st["m"] + (1 - b1) * g
      st["v"] = b2 * st["v"] + (1 - b2) * g * g
      m_hat = st["m"] / (1 - b1 ** st["t"])
      v_hat = st["v"] / (1 - b2 ** st["t"])
      return w - lr * m_hat / (np.sqrt(v_hat) + eps)
key_lines: [8, 9, 12]
time: "O(d) per step for d parameters"
space: "O(d) extra, two moment buffers the size of the parameters"
hyperparameters:
  - "Learning rate $\\eta$"
  - "$\\beta_1$ (decay of the gradient average)"
  - "$\\beta_2$ (decay of the squared-gradient average)"
  - "$\\epsilon$ (numerical floor in the denominator)"
pitfalls:
  - "Skipping bias correction makes early steps too small"
  - "L2 regularisation inside Adam is not true weight decay; use AdamW"
  - "Adam can generalise worse than tuned SGD on some tasks"
  - "Near-zero gradients with a tiny ε can still produce large steps"
interview_qa:
  - q: "What do $m$ and $v$ represent?"
    a: "$m$ is an exponential average of gradients (momentum) and $v$ is an exponential average of squared gradients (per-parameter scale)."
  - q: "Why bias correction?"
    a: "m and v start at zero, so early averages are biased toward zero; dividing by $1-\\beta^t$ rescales them."
  - q: "How does AdamW differ from Adam with L2?"
    a: "AdamW applies weight decay directly to the weights instead of adding it to the gradient, so the decay is not rescaled by the adaptive denominator."
related: [gradient-descent, backpropagation, mlp-forward-pass]
patterns: ["Gradient-based optimisation"]
math_tex:
- $m \leftarrow \beta_1 m + (1-\beta_1)\,g$
- $v \leftarrow \beta_2 v + (1-\beta_2)\,g^2$
- $\hat{m} = \frac{m}{1-\beta_1^{\,t}},\;\; \hat{v} = \frac{v}{1-\beta_2^{\,t}}$
- $w \leftarrow w - \eta\,\frac{\hat{m}}{\sqrt{\hat{v}}+\epsilon}$
- 'Defaults: $\beta_1=0.9,\ \beta_2=0.999,\ \epsilon=10^{-8}$'
