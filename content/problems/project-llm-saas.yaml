time: "O(1) per request plus O(E) to total a tenant's events when invoicing E events"
space: "O(T) buckets, O(U) cache entries and O(E) stored billing events"
when_to_use: |
  Putting a model behind an API for several paying customers, where each
  needs its own quota, bill and data boundary, and where retries are
  routine so billing must be safe to repeat.
when_not_to_use: |
  An internal tool with one trusted team, where a single shared limit
  is enough, or real billing, which needs a durable ledger, invoicing
  rules and tax handling beyond this skeleton.
why_it_works: |
  A token bucket bounds a tenant to at most $C + r t$ units in any
  window of length $t$, and each tenant has its own state, so one
  tenant's usage cannot consume another's allowance. Recording keyed by
  event id is idempotent: applying it twice leaves the same state as
  applying it once, so total tokens equal the sum over unique ids no
  matter how often a request is retried. Prefixing the tenant to every
  cache key makes the key spaces disjoint.
math:
  - "Bucket bound: tokens in window t ≤ C + r · t"
  - "Invoice = (Σ unique-event tokens / 1000) · price per 1k"
  - "Cost = (Σ unique-event tokens / 1000) · unit cost per 1k"
  - "Margin = invoice − cost = tokens/1000 · (price − unit cost)"
  - "Margin % = (price − unit cost) / price"
  - "Daily cap D: spend per tenant per day ≤ D / 1000 · unit cost"
hyperparameters:
  - 'Bucket capacity $C$ and refill rate $r$ per plan'
  - 'Daily token cap $D$ per plan'
  - 'Price and unit cost per 1,000 tokens'
  - 'Idempotency id scope and retention time'
pitfalls:
  - 'Deriving the event id from a timestamp or counter on the server, which makes every retry look new; the client or request must supply it'
  - 'A cache key built from the prompt alone, which leaks one tenant''s answer to another'
  - 'Checking the quota and then updating usage in separate steps without a lock, so concurrent requests overspend'
  - 'Pricing from average usage; a few heavy tenants can make a plan negative, so look at margin per tenant'
interview_qa:
  - q: "How do you make usage billing safe against retries?"
    a: 'Each request carries a unique id, and the meter stores events by that id and ignores one it has seen. Recording is then idempotent, so a retry after a timeout leaves the invoice unchanged. The id must come from the client or be fixed before the first attempt.'
  - q: "Why a token bucket per tenant instead of one global limit?"
    a: 'A global limit lets one heavy tenant starve the rest. A bucket per tenant with capacity $C$ and refill rate $r$ allows bursts up to $C$ and a long-run rate of $r$, and an exhausted bucket only rejects that tenant''s requests.'
  - q: "How do you isolate tenants in a shared cache?"
    a: 'Put the tenant id in every key, here by prefixing the hash of the prompt, so the key spaces never overlap. The same applies to stored data, logs and any vector index, where a missing filter is the usual leak.'
  - q: "What does the margin per tenant tell you?"
    a: 'It is revenue minus cost, tokens times the difference between price and unit cost per 1,000 tokens. A plan with a flat fee and unlimited use can go negative for heavy users, so the daily cap and per-plan quotas bound the loss.'
  - q: "When should the daily cap trigger, and what should the client see?"
    a: 'It triggers when the day''s recorded tokens reach the plan cap, before any model call, so the cost stops at a known bound. The client gets 429 with a reason such as daily cap, which differs from a transient rate limit that clears in seconds.'
