time: "O(nlist·d + (nprobe/nlist)·N·d) per query versus O(N·d) exact; build is k-means"
space: "O(N·d) for the vectors plus O(nlist·d) for centroids"
hyperparameters:
  - "nlist, the number of cells, often about $\\sqrt{N}$"
  - "nprobe, the number of cells scanned per query"
  - "k-means iterations and seed"
  - "HNSW alternative: graph degree $M$ and search width $ef$"
pitfalls:
  - "Recall is not guaranteed: a true neighbour in an unprobed cell is lost, so always measure recall@k against brute force on real queries"
  - "Cells are rarely balanced, so the real cost depends on the sizes of the probed cells, not just the formula"
  - "Centroids go stale when the data distribution drifts; re-train the quantiser periodically"
  - "Euclidean cells assume the metric matches the one used to cluster; normalise vectors if you search by cosine"
interview_qa:
  - q: "Why does IVF raise recall when nprobe grows?"
    a: "More cells are scanned, so more of the corpus is searched exactly. At $n_{probe} = n_{list}$ every vector is scanned and the result equals brute force."
  - q: "How does HNSW differ from IVF?"
    a: "HNSW is a layered proximity graph. Search enters at the sparse top layer, greedily moves to closer neighbours, then descends, keeping $ef$ candidates at the bottom. It usually gives high recall at low latency but uses more memory and has no training step."
  - q: "What does product quantisation do?"
    a: "It splits each vector into sub-vectors and replaces each with the index of its nearest codebook entry, compressing a vector to a few bytes. Distances are approximated from the codes, trading accuracy for memory."
  - q: "How do you choose nlist and nprobe?"
    a: "Pick $n_{list}$ near $\\sqrt{N}$, then raise $n_{probe}$ until recall@k on held-out queries meets the target, accepting the latency that results."
