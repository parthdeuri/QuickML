id: multimodal-and-speech
name: Multimodal and speech
order: 31
summary: Turn images, video and audio into a grid or sequence of vectors that a
  transformer can read like text tokens.
when_to_use:
- You feed pictures, clips or sound to a transformer or a language model.
- You need to budget how many tokens an image, video or audio clip will cost.
- Several modalities must be aligned in one embedding space or fused for retrieval.
key_idea: A transformer only reads a sequence of vectors, so every modality is cut
  into pieces and projected. An image becomes non-overlapping patches, a video
  becomes a few sampled frames each turned into patches, and audio becomes
  overlapping windows whose count follows from window length and hop. Knowing the
  token count in advance is what makes the cost and the context budget predictable.
template: |
  import numpy as np

  def patchify(img, P):
      C, H, W = img.shape
      x = img.reshape(C, H // P, P, W // P, P)
      x = x.transpose(1, 3, 0, 2, 4)        # (gh, gw, C, P, P)
      return x.reshape(-1, C * P * P)       # (N, C*P*P)

  def image_tokens(H, W, P):
      return (H // P) * (W // P)

  def sample_frames(n_frames, k):
      idx = np.linspace(0, n_frames - 1, k)
      return np.round(idx).astype(int)

  def video_tokens(n_frames, k, H, W, P):
      return k * image_tokens(H, W, P)

  def audio_frames(n_samples, win, hop):
      return 1 + (n_samples - win) // hop
complexity: Patchify and framing are O(input size); attention over the resulting tokens is quadratic in their count.
pitfalls:
- Image sizes not divisible by the patch size must be padded or resized first.
- Sampling too few video frames misses fast events, while sampling many frames explodes the token count.
- Window and hop choices fix the audio time resolution; short windows blur pitch and long windows blur timing.
