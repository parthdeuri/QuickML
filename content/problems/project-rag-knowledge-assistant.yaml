time: "O(P·d) per question over the P permitted chunks for the dense scan and O(|q|·P) for term overlap, plus one model call; ANN and inverted indexes make retrieval sublinear"
space: "O(C·d) for C chunk vectors plus text, tokens and an ACL set per chunk"
hyperparameters:
  - "Chunk size and overlap (here one sentence per chunk)"
  - 'Retrieved chunks $k$ and the RRF constant, about 60'
  - 'Abstention threshold $\tau$ on evidence coverage'
  - "ACL model: groups, roles or per-user lists, and where it is stored"
pitfalls:
  - "Post-filtering by permission, or filtering only the citations, lets forbidden text reach the prompt; restrict candidates before ranking"
  - "Stale ACLs: a permission change must update chunk metadata, or revoked users keep access and new users are locked out"
  - "Re-ingesting under a new id instead of the same id leaves old chunks answering with outdated facts"
  - "A model that paraphrases can still add unsupported claims; the quoting stub gets faithfulness 1 only because it cannot generate, so real systems need a claim-level check"
interview_qa:
  - q: "Why enforce permissions at retrieval and not in the model prompt?"
    a: "A model cannot be trusted to withhold text it has seen, and instructions can be bypassed. If a forbidden chunk is never retrieved it cannot appear in the prompt, the answer or the citations. The filter must be a hard pre-filter, because oversampling and post-filtering are only probabilistic."
  - q: "How does this differ from a PDF question-answering pipeline?"
    a: "It is multi-user, so every chunk carries an ACL and queries carry an identity. It is updatable, so documents have stable ids and re-ingest replaces chunks. It also abstains and cites, since users act on the answers and need to verify them."
  - q: "How do you decide when to abstain?"
    a: "Use an evidence signal such as coverage of the question terms by the best chunk, or a retriever or reranker score, and set the threshold on a labelled set to trade wrong answers against needless refusals. Abstaining on no permitted evidence also avoids hinting that a hidden document exists."
  - q: "How do you keep the index fresh at scale?"
    a: "Process change events: on an edit delete the chunks of that document id and insert the new ones, on a delete remove them, on a permission change update the ACL metadata. Run periodic reconciliation against the source of truth and rebuild approximate indexes as deletions accumulate."
  - q: "What would you monitor in production?"
    a: "Retrieval recall on a labelled set, faithfulness and citation validity of sampled answers, abstention rate, index lag after edits, and a canary test that restricted documents never appear for unauthorised test users."
related: [rag-dense-retrieval, metadata-filtering, rag-evaluation-faithfulness]
math_tex:
- '$\mathrm{Visible}(u,c) = 1$ if $\mathrm{groups}(u) \cap \mathrm{ACL}(c) \neq \emptyset$'
- 'Candidates $= \{c : \mathrm{Visible}(u,c) = 1\}$, before ranking'
- '$\mathrm{RRF}(c) = \sum \frac{1}{60 + \mathrm{rank}(c)}$'
- 'Evidence $= \max \frac{|Q \cap \mathrm{chunk}|}{|Q|}$; abstain if $< \tau$'
- 'Faithfulness: $\frac{\mathrm{supported\ claims}}{\mathrm{claims}}$'
- 'Chunks per doc: $\lceil \frac{\mathrm{doc\ tokens}}{\mathrm{chunk\ tokens}} \rceil$'
- 'Prompt $\approx$ system $+ k \cdot$ chunk tokens $+$ question'
