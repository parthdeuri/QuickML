slug: kernel-trick-rbf
title: Kernel Trick and RBF Kernel Ridge
url: https://en.wikipedia.org/wiki/Radial_basis_function_kernel
difficulty: Medium
area: Classical ML
topics: [Kernel Methods, Non-linear, Regression, Regularisation]
summary: |
  Replace dot products by a kernel so a linear method works in a huge
  implicit feature space. With the RBF kernel and ridge regression this
  gives a smooth non-linear regressor using only an $n$ by $n$ Gram matrix.
intuition: |
  Many linear algorithms touch the data only through dot products between
  points. If you swap each dot product for a kernel $k(x, z)$ that equals a
  dot product in some richer feature space, you get a non-linear model
  without ever building those features. The RBF kernel is a similarity
  that decays with distance, which corresponds to an infinite-dimensional
  feature space.
why_it_works: |
  By the representer theorem the minimiser of a regularised loss lies in
  the span of the kernel functions centred on the training points, so the
  problem reduces to $n$ coefficients. A positive semidefinite kernel is
  guaranteed (Mercer) to be an inner product in some feature space, and
  the ridge penalty keeps the solve well conditioned. The bandwidth $\gamma$ sets
  how local the similarity is.
when_to_use: |
  Small to medium datasets (up to a few thousand points) with smooth
  non-linear structure, kernel SVMs and kernel ridge baselines, and
  Gaussian-process-style regression.
when_not_to_use: |
  Large $n$, since the Gram matrix costs quadratic memory and the solve
  cubic time (use random features, Nyström or neural nets), or
  high-dimensional sparse data where a linear model already works.
math:
  - "RBF: k(x, z) = exp(−γ ‖x − z‖²)"
  - "Expand: ‖x−z‖² = ‖x‖² + ‖z‖² − 2 xᵀz"
  - "Gram matrix: Kᵢⱼ = k(xᵢ, xⱼ), symmetric and PSD"
  - "Kernel ridge: α = (K + λI)⁻¹ y"
  - "Prediction: f(x) = Σᵢ αᵢ k(x, xᵢ)"
  - "Trick: k(x, z) = φ(x)ᵀ φ(z) without computing φ"
approach:
  - "Compute squared distances through $\\|x\\|^2 + \\|z\\|^2 - 2x^{\\top}z$ — one matrix product instead of a double loop"
  - "Clip tiny negative distances to zero and apply $\\exp(-\\gamma d^2)$ — rounding can push distances below zero"
  - "Build the training Gram matrix $K$ — it holds all pairwise similarities"
  - "Solve $(K + \\lambda I)\\alpha = y$ — the ridge term makes the system invertible and controls overfitting"
  - "Predict with the test-versus-train kernel matrix times $\\alpha$ — a weighted sum of similarities to training points"
code: |
  import numpy as np

  def rbf(A, B, gamma):
      d2 = (A ** 2).sum(1)[:, None] + (B ** 2).sum(1) - 2 * A @ B.T
      return np.exp(-gamma * np.maximum(d2, 0))

  def kernel_ridge(X, y, Xt, gamma, lam):
      K = rbf(X, X, gamma)
      alpha = np.linalg.solve(K + lam * np.eye(len(X)), y)
      return rbf(Xt, X, gamma) @ alpha
key_lines: [4, 5, 9]
time: "O(n²·d) to build the Gram matrix plus O(n³) for the solve"
space: "O(n²) for the Gram matrix"
hyperparameters:
  - "Bandwidth $\\gamma$ — large $\\gamma$ is local and can overfit, small $\\gamma$ approaches a linear fit"
  - "Regularisation $\\lambda$ — larger values smooth the fit"
  - "Kernel choice — RBF, polynomial, linear or others"
  - "Feature scaling — the RBF distance is dominated by large-scale features"
pitfalls:
  - "Features must be scaled, otherwise $\\gamma$ means different things per dimension"
  - "Memory and time grow with $n^2$, so it does not scale to millions of rows"
  - "This is kernel ridge (squared loss, dense $\\alpha$), not an SVM: no sparse support vectors"
  - "Far from the training data the prediction decays toward zero because the kernel does, so extrapolation is poor"
interview_qa:
  - q: "What is the kernel trick?"
    a: "If an algorithm uses data only through inner products, you can replace them with a kernel function that equals an inner product in a richer feature space, getting non-linearity without computing the features."
  - q: "What does the RBF bandwidth control?"
    a: "How fast similarity falls with distance: large $\\gamma$ gives very local, wiggly fits that can overfit; small $\\gamma$ gives smooth, nearly linear fits that can underfit."
  - q: "What makes a function a valid kernel?"
    a: "It must be symmetric and positive semidefinite, meaning every Gram matrix has non-negative eigenvalues (Mercer's condition)."
  - q: "Kernel ridge versus SVM?"
    a: "Both use kernels; kernel ridge uses squared loss and has a closed form with all points contributing, while the SVM's hinge loss yields sparse support vectors via a quadratic program."
related: [svm, ridge-lasso-regularization, linear-regression]
patterns: ["Linear models"]
math_tex:
- 'RBF: $k(x,z) = \exp(-\gamma\,\|x - z\|^2)$'
- 'Expand: $\|x - z\|^2 = \|x\|^2 + \|z\|^2 - 2\,x^{\top}z$'
- 'Gram matrix: $K_{ij} = k(x_i, x_j)$, symmetric and PSD'
- 'Kernel ridge: $\alpha = (K + \lambda I)^{-1}\,y$'
- 'Prediction: $f(x) = \sum_i \alpha_i\,k(x, x_i)$'
- 'Trick: $k(x,z) = \varphi(x)^{\top}\varphi(z)$ without computing $\varphi$'
