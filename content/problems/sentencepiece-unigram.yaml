time: "O(L²) per word for Viterbi and for each lattice pass; one EM step is O(L²) per word in the corpus"
space: "O(V) probabilities plus O(L) lattice arrays per word"
when_to_use: |
  Languages without spaces or with rich morphology, multilingual models,
  and settings where sampling several segmentations (subword
  regularisation) helps robustness.
when_not_to_use: |
  When a simple deterministic vocabulary is enough and training speed
  matters most, since Unigram training with EM and pruning is slower than
  counting merges in BPE.
why_it_works: |
  Under a unigram model the probability of a word is the sum over its
  segmentations of the product of token probabilities, so the best
  segmentation maximises $\sum \log p(t)$, which dynamic programming solves
  exactly because the score is additive along the path. EM then raises
  the corpus likelihood at every step, and the loss increase from
  deleting a token measures how much the model relies on it.
math:
  - "P(x) = Σ over segmentations s of x:  Π p(tᵢ)"
  - "best(j) = max over i<j of  best(i) + log p(x[i:j])"
  - "E-step: count(t) = Σ over words f · P(t used | word)"
  - "M-step: p(t) = count(t) / Σ over t' of count(t')"
  - "loss = − Σ over words f · log P(word)"
interview_qa:
  - q: "How does Unigram tokenisation differ from BPE?"
    a: "BPE greedily adds merges and applies them in order. Unigram holds a probabilistic model over a large vocabulary, prunes it down, and segments with the highest-probability path, so it can also sample alternative segmentations."
  - q: "How is the best segmentation found?"
    a: "By Viterbi dynamic programming over end positions: the best score ending at $j$ is the best over previous cut points $i$ of the score at $i$ plus $\\log p$ of the piece."
  - q: "How are tokens pruned?"
    a: "For each token compute how much the corpus loss would rise if it were removed and refit; drop the lowest-impact fraction each round, always keeping single characters."
  - q: "What does SentencePiece do with spaces?"
    a: "It treats the text as a raw character sequence and replaces the space by a marker such as \"▁\", so detokenising is lossless and no pre-tokeniser is needed."
hyperparameters:
  - "Target vocabulary size"
  - "Initial vocabulary size (candidate substrings)"
  - "Fraction pruned per round"
  - "Sampling temperature $\\alpha$ for subword regularisation"
pitfalls:
  - "Single characters must never be pruned, or some words become unsegmentable"
  - "Viterbi favours fewer, longer tokens because every extra token multiplies in another probability below 1"
  - "Probabilities must be renormalised after pruning so they sum to 1"
  - "A hard Viterbi count is only an approximation of the EM expected counts"
