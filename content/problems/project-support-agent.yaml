slug: project-support-agent
title: "Project Blueprint: Customer Support Agent"
url: https://www.anthropic.com/engineering/building-effective-agents
difficulty: Hard
area: LLM
topics: [LLM, Agents, Project, Tool Use, Safety]
summary: |
  Build a support agent that classifies intent with a confidence score,
  answers FAQs from a knowledge base with a cited source, looks up
  orders, requests refunds only after explicit confirmation, escalates
  to a human when unsure or when the customer is upset, and writes logs
  with personal data redacted.
intuition: |
  The model is the cheap, fallible part, so the design puts hard rules
  around it. Retrieval grounds answers in the knowledge base, a
  permission gate makes the one risky tool (refund) a two-turn
  handshake, and an escalation path catches anything the classifier is
  unsure about. The main trade-off is the confidence threshold $\tau$:
  a high $\tau$ is safe but sends more tickets to humans, a low $\tau$
  automates more but lets wrong answers through. Redaction sits at the
  logging boundary so no code path can forget it.
  Flow: message → intent → answer, tool or escalate.
approach:
  - "Write the knowledge base and a hashing embedder — retrieval returns the best entry with its id, so every answer carries a source"
  - "Build the classifier with a confidence $c = \\frac{\\text{best}}{\\text{total}}$ — an ambiguous or empty match gives low $c$ and routes to escalation"
  - "Register tools with a confirm-required set — the gate denies unknown tools and holds a refund until the customer says yes"
  - "Keep per-session state (pending action, transcript) — confirmation is a second turn that must refer to the first"
  - "Add escalation rules for low $c$, weak retrieval or an upset customer — the human gets the whole transcript"
  - "Redact emails and order ids in the logger and replay scripted dialogs — the tests lock the behaviour before any real model is used"
code: |
  import re, zlib
  import numpy as np

  KB = {"returns": "Returns are accepted within 30 days of delivery.",
        "shipping": "Standard shipping takes 3 to 5 business days."}
  ORDERS = {"A100": "shipped", "B200": "processing"}
  KEYS = {"faq": ("return", "ship", "polic"), "order": ("order",
          "status", "track"), "refund": ("refund",)}
  UPSET = {"furious", "angry", "unacceptable", "terrible"}
  PII = [(re.compile(r"[\w.+-]+@[\w-]+\.\w+"), "<EMAIL>"),
         (re.compile(r"\b[A-Z]\d{3}\b"), "<ORDER>")]

  def embed(t, d=64):
      v = np.zeros(d)
      for w in re.findall(r"[a-z]+", t.lower()):
          v[zlib.crc32(w[:5].encode()) % d] += 1
      return v / (np.linalg.norm(v) or 1)

  def retrieve(q):
      s = {k: float(embed(q) @ embed(v)) for k, v in KB.items()}
      k = max(s, key=s.get)
      return k, s[k]

  def classify(msg):
      w = re.findall(r"[a-z]+", msg.lower())
      n = {i: sum(x.startswith(p) for x in w for p in ps)
           for i, ps in KEYS.items()}
      tot = sum(n.values())
      best = max(n, key=n.get)
      return best, (n[best] / tot if tot else 0.0)

  class SupportAgent:
      TOOLS = {"lookup_order": lambda a: ORDERS[a["id"]],
               "request_refund": lambda a: "refund " + a["id"]}
      CONFIRM = {"request_refund"}

      def __init__(self, tau=0.6):
          self.tau, self.logs, self.refunds = tau, [], []

      def log(self, s):
          for pat, tag in PII:
              s = pat.sub(tag, s)
          self.logs.append(s)

      def call(self, name, args, ok=False):
          if name not in self.TOOLS:
              return "denied: unknown tool"
          if name in self.CONFIRM and not ok:
              return "needs_confirmation"
          out = self.TOOLS[name](args)
          if name == "request_refund":
              self.refunds.append(args["id"])
          return out

      def escalate(self, s, why):
          self.log("escalate: " + why)
          return {"action": "escalate", "why": why,
                  "transcript": list(s["turns"])}

      def handle(self, s, msg):
          s.setdefault("turns", []).append(msg)
          self.log("user: " + msg)
          if s.get("pending"):
              order, s["pending"] = s["pending"], None
              if msg.lower().strip() in ("yes", "confirm"):
                  out = self.call("request_refund", order, ok=True)
                  return {"action": "tool", "text": out}
              return {"action": "answer", "text": "Cancelled."}
          if UPSET & set(re.findall(r"[a-z]+", msg.lower())):
              return self.escalate(s, "upset customer")
          intent, c = classify(msg)
          m = re.search(r"\b[A-Z]\d{3}\b", msg)
          if c < self.tau or intent == "faq" and retrieve(msg)[1] < 0.1:
              return self.escalate(s, "low confidence")
          if intent == "faq":
              k, _ = retrieve(msg)
              return {"action": "answer", "text": KB[k], "source": k}
          if m is None or m.group() not in ORDERS:
              return self.escalate(s, "no valid order id")
          args = {"id": m.group()}
          if intent == "order":
              return {"action": "tool",
                      "text": self.call("lookup_order", args)}
          s["pending"] = args
          return {"action": "confirm",
                  "text": "Refund " + args["id"] + "? Say yes."}
