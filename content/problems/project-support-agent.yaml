time: "O(K·d) per message for $K$ knowledge-base entries and embedding size $d$, plus one tool call"
space: "O(K·d + T) for the embedded knowledge base and the $T$-turn transcript per session"
when_to_use: |
  High-volume support with repetitive questions and a few well-defined
  actions, where a wrong answer is cheap to fix but a wrong refund is
  not. The structure also fits any agent with one risky tool.
when_not_to_use: |
  Open-ended or legally sensitive cases (disputes, medical or financial
  advice) where a human should lead, and flows with many interacting
  tools that need real planning rather than three fixed intents.
why_it_works: |
  Each failure mode gets its own control. Wrong answers are limited by
  grounding in retrieved text and by escalating when confidence is
  below $\tau$. Wrong actions are limited by the gate, which executes
  a refund only on a confirmed second turn, so a single model mistake
  cannot move money. Privacy is enforced where logs are written, which
  makes it independent of how the model behaves.
math:
  - "Intent confidence c = (hits of best intent) / (hits of all intents)"
  - "Escalate when c < τ, or retrieval cosine < 0.1, or customer upset"
  - "Escalation rate e = P(c < τ) + P(upset) + P(weak retrieval)"
  - "Cost per ticket = (1 − e) · c_bot + e · c_human"
  - "Example: e = 0.25, c_bot = 0.02, c_human = 4 → 1.015 per ticket"
  - "Human load = e · tickets per day; capacity must exceed it"
  - "Refund executions per confirmed request = exactly 1"
interview_qa:
  - q: "Why must a refund need confirmation if the classifier is confident?"
    a: "Confidence measures how well the message matches an intent, not whether the customer meant it or whether the action is safe. A refund is hard to undo, so the gate is a rule that does not depend on the model. A confirm turn also gives the customer a chance to catch a wrong order id."
  - q: "How do you pick the confidence threshold?"
    a: "Label a sample of tickets, then sweep the threshold and plot the share automated against the error rate of those automated answers. Pick the point where the error rate is acceptable for the cost of a wrong answer, and re-check it as traffic changes. Risky intents can use a higher threshold than FAQs."
  - q: "What should the human receive on escalation?"
    a: "The full transcript, the detected intent and confidence, the reason for escalating and any pending action, so the customer does not repeat themselves. Redaction still applies to stored copies."
  - q: "How do you test an agent whose model is non-deterministic?"
    a: "Replace the model with scripted stubs and test the surrounding logic with fixed dialogs: gate, state, escalation and logging. Then evaluate the real model separately on a labelled set for intent accuracy and task success."
hyperparameters:
  - "Confidence threshold $\\tau$ for escalation, possibly per intent"
  - "Retrieval cutoff and the number of knowledge-base entries returned"
  - "Set of tools that need confirmation, and the allowed confirmation phrases"
  - "Upset-customer trigger (keyword list or sentiment score)"
pitfalls:
  - "Treating any message after a refund request as confirmation; only an explicit yes should execute, and the pending action must expire"
  - "Redacting only the final reply while raw text leaks into logs, traces or error messages"
  - "A keyword classifier is crude: negations and typos produce confident wrong intents, so measure it on real tickets"
  - "Executing a retried or duplicated confirmation twice; refunds need an idempotency key, not just a UI check"
