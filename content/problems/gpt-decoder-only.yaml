slug: gpt-decoder-only
title: GPT Decoder-Only Language Model (Full Forward Pass)
url: https://huggingface.co/docs/transformers/model_doc/gpt2
difficulty: Hard
area: LLM
topics: [LLM, Transformers, GPT, Weight Tying]
summary: |
  The whole GPT model: token plus position embeddings, $N$ pre-norm
  causal blocks, a final LayerNorm, and a vocabulary projection that
  reuses the embedding matrix, giving next-token logits at every position.
intuition: |
  Where the block card shows one layer, this is the full model. Token
  ids become vectors, a learned position vector is added so the model
  knows order, and $N$ identical causal blocks refine a residual stream.
  A final LayerNorm and the transposed embedding matrix turn each
  position back into scores over the vocabulary. Training scores every
  position's next token in one pass; generation feeds the sampled token
  back in. GPT is decoder-only: no encoder and no cross-attention, unlike
  BERT (encoder-only, bidirectional) or T5 (encoder-decoder).
  Flow: token ids → embeddings + positions → N blocks → final norm → logits.
approach:
  - "Look up token embeddings $E[\\text{id}]$ and add learned position rows $P[t]$ — the stream starts as $(T, d)$"
  - "Run $N$ pre-norm blocks, each adding causal attention and a GELU MLP to the stream — the residual path stays identity"
  - "Apply a final LayerNorm — pre-norm stacks leave the stream unnormalised"
  - "Multiply by $E^{\\top}$ (weight tying) — logits $(T, V)$ with no extra output matrix"
  - "Train with cross-entropy of row $t$ against token $t+1$; generate by sampling the last row and appending — same weights, two uses"
code: |
  import numpy as np

  def ln(x, g, b, eps=1e-5):
      m = x.mean(-1, keepdims=True)
      v = x.var(-1, keepdims=True)
      return g * (x - m) / np.sqrt(v + eps) + b

  def gelu(t):
      c = np.sqrt(2 / np.pi)
      return 0.5 * t * (1 + np.tanh(c * (t + 0.044715 * t**3)))

  def attn(x, B, h):
      T, d = x.shape
      q, k, v = np.split(x @ B["Wqkv"] + B["bqkv"], 3, -1)
      q, k, v = (m.reshape(T, h, d // h).transpose(1, 0, 2)
                 for m in (q, k, v))
      s = q @ k.transpose(0, 2, 1) / np.sqrt(d // h)
      s = np.where(np.triu(np.ones((T, T), bool), 1), -np.inf, s)
      e = np.exp(s - s.max(-1, keepdims=True))
      a = (e / e.sum(-1, keepdims=True)) @ v
      return a.transpose(1, 0, 2).reshape(T, d) @ B["Wo"] + B["bo"]

  def block(x, B, h):
      x = x + attn(ln(x, B["g1"], B["b1"]), B, h)
      y = gelu(ln(x, B["g2"], B["b2"]) @ B["W1"] + B["c1"])
      return x + y @ B["W2"] + B["c2"]

  def gpt_forward(token_ids, params, heads=2):
      T = len(token_ids)
      x = params["wte"][token_ids] + params["wpe"][:T]
      for B in params["blocks"]:
          x = block(x, B, heads)
      x = ln(x, params["gf"], params["bf"])
      return x @ params["wte"].T
