time: "O(N·(T²·d + T·d²) + T·d·V) per forward pass"
space: "O(h·T²) scores per block plus O(T·d) stream and O(T·V) logits"
when_to_use: |
  Understanding or implementing any GPT-style language model, and for
  explaining how training (parallel next-token loss) and inference
  (autoregressive decoding) share one network.
when_not_to_use: |
  Tasks that need bidirectional encoding of a fixed input, such as
  classification or span filling, where an encoder fits better, or
  sequence-to-sequence tasks where an encoder-decoder is a natural fit.
why_it_works: |
  The causal mask makes row $t$ of the logits depend only on tokens up
  to $t$, so one pass gives $T$ valid training predictions and the same
  network decodes token by token. Tying the output matrix to $E$ means
  the embedding and the scoring of each token share one vector, which
  saves $V \cdot d$ parameters and ties input and output meaning.
math:
  - "h⁰ = E[ids] + P[0:T]"
  - "hˡ = hˡ⁻¹ + Attn(LN(hˡ⁻¹)),  then  + FFN(LN(·))"
  - "z = LN_f(hᴺ)"
  - "logits = z Eᵀ  (weight tying), shape (T, V)"
  - "p(xₜ₊₁ | x≤ₜ) = softmax(logitsₜ)"
  - "Loss = −(1/T) Σₜ log p(xₜ₊₁ | x≤ₜ)"
interview_qa:
  - q: "What makes GPT decoder-only, and how does it differ from BERT and T5?"
    a: "GPT is a single stack with causal self-attention and no encoder or cross-attention. BERT is encoder-only with bidirectional attention, and T5 pairs an encoder with a decoder that cross-attends to it."
  - q: "What is weight tying and why use it?"
    a: "The output projection reuses the token embedding matrix, so logits are $z E^{\\top}$. It saves $V d$ parameters and often helps small models."
  - q: "How is the same model trained and then used for generation?"
    a: "Training applies a causal mask and next-token cross-entropy at all positions in parallel. Generation runs the same forward pass, samples from the last row and appends it, usually with a KV cache."
  - q: "Why a final LayerNorm before the logits?"
    a: "With pre-norm the residual stream is never normalised inside the stack, so one last LayerNorm gives the output projection a stable scale."
hyperparameters:
  - "Vocabulary size $V$ and context length $T_{\\max}$ (size of the position table)"
  - "Width $d$, heads $h$ and layers $N$"
  - "MLP hidden size, typically $4d$"
  - "Whether the output matrix is tied to the embedding"
pitfalls:
  - "Using $E$ instead of $E^{\\top}$ for the output, or transposing GPT-2 Conv1D weights that are already stored as (in, out)"
  - "Feeding more tokens than the position table holds; learned absolute positions cannot extrapolate"
  - "Forgetting the final LayerNorm, which changes every logit"
  - "Mixing up shifts: row $t$ predicts token $t+1$, so targets are the inputs shifted left by one"
related: [decoder-only-block, bert-masked-lm, next-token-prediction-loss]
math_tex:
- 'Embed: $h^0 = E[\mathrm{ids}] + P_{0:T}$'
- 'Blocks: $h^{l} = h^{l-1} + \mathrm{Attn}(\mathrm{LN}(h^{l-1}))$, then FFN'
- 'Final norm: $z = \mathrm{LN}_f(h^N)$'
- 'Tied: $\mathrm{logits} = z\,E^{\top}$, shape $(T, V)$'
- 'Next token: $p(x_{t+1} \mid x_{\leq t}) = \mathrm{softmax}(\mathrm{logits}_t)$'
- 'Loss: $-\frac{1}{T}\sum_t \log p(x_{t+1} \mid x_{\leq t})$'
