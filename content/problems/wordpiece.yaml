time: "O(L²) substring lookups per word of length L at inference; O(pairs) per merge in training"
space: "O(V) for the vocabulary, plus the split corpus during training"
when_to_use: |
  Building a subword vocabulary for BERT-style encoders, where an open
  vocabulary with a small table is needed and rare words should break into
  known pieces instead of one unknown token.
when_not_to_use: |
  When you need byte-level coverage with no unknown tokens at all, where
  byte-level BPE is the usual choice. WordPiece also replaces a whole word
  by [UNK] if any part cannot be matched.
why_it_works: |
  Choosing the pair with the highest $\mathrm{freq}(ab)/(\mathrm{freq}(a)\,\mathrm{freq}(b))$
  approximates the merge that most increases the training-corpus
  likelihood under a unigram model, because it measures how much more
  often $a$ and $b$ co-occur than independence predicts. Longest-match
  inference is a cheap greedy cut using only the final vocabulary.
math:
  - "score(a, b) = freq(ab) / (freq(a) · freq(b))"
  - "BPE picks the pair maximising freq(ab) alone"
  - "token(w) = longest prefix in V; rest gets the ## prefix"
  - "if no prefix of the rest is in V: whole word → [UNK]"
interview_qa:
  - q: "How does WordPiece differ from BPE?"
    a: "BPE merges the most frequent pair. WordPiece merges the pair with the highest $\\mathrm{freq}(ab)/(\\mathrm{freq}(a)\\,\\mathrm{freq}(b))$, so pieces that are individually common are not merged just because they are common. At inference WordPiece uses longest match, not the learned merge order."
  - q: "What does the $\\#\\#$ prefix mean?"
    a: "It marks a piece that continues the previous one inside a word, so the original words can be rebuilt by joining pieces and stripping $\\#\\#$."
  - q: "What happens to a word that cannot be segmented?"
    a: "If at some position no prefix of the remainder is in the vocabulary, the whole word becomes [UNK], not just the unmatched part."
  - q: "Is greedy longest match always the best segmentation?"
    a: "No. It is fast and deterministic but can choose a worse split than a search over all segmentations, as a unigram model with Viterbi would."
hyperparameters:
  - "Target vocabulary size"
  - "Base alphabet and normalisation (lower-casing, accent stripping)"
  - "Continuation prefix (## in BERT)"
  - "Maximum characters per word before falling back to [UNK]"
pitfalls:
  - "Training needs the splits to start as characters with $\\#\\#$; plain characters give a different vocabulary"
  - "The merged token drops the $\\#\\#$ of its second part, and keeps the $\\#\\#$ of its first part"
  - "Inference ignores merge order, so it can differ from how the vocabulary was built"
