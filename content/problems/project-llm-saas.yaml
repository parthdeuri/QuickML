slug: project-llm-saas
title: 'Project Blueprint: Multi-Tenant LLM SaaS Backend'
url: https://stripe.com/blog/idempotency
difficulty: Hard
area: MLOps
topics: [Project, Multi-Tenancy, Metering, Rate Limiting]
summary: |
  Build the backend of a multi-tenant LLM product: API keys that map to
  tenants and plans, a token bucket per tenant, usage metering that
  turns each request into an idempotent billing event, tenant-isolated
  caching, a margin report per tenant and a hard daily cap against
  abuse.
intuition: |
  The model call is the easy part; the product is the layer around it.
  Three properties matter. Fairness: one bucket per tenant means a
  tenant that exhausts its quota hurts only itself. Correctness of
  money: clients and gateways retry, so every billing event carries an
  id and the meter ignores an id it has already seen, which makes
  recording idempotent. Isolation: anything stored or cached is keyed by
  tenant, because a cache shared by prompt alone would hand one
  customer another's answer. Revenue per tenant is price times tokens
  and cost is unit cost times tokens, so margin shows which plan loses
  money, and the daily cap bounds the worst case.
  Flow: request → tenant → quota check → model → usage event → invoice.
approach:
  - 'Map each API key to a tenant and plan, and reject unknown keys with 401 — nothing else runs unauthenticated'
  - 'Give each tenant its own token bucket with capacity $C$ and rate $r$ from its plan — quotas are per tenant, so neighbours are isolated'
  - 'Namespace every cache key and stored record by tenant — identical prompts never share answers across customers'
  - 'Record one usage event per request with an idempotency id, ignoring ids already seen — a retry must not bill twice'
  - 'Invoice as unique tokens times the price, and margin as invoice minus cost — plans that lose money become visible'
  - 'Enforce a hard daily cap per tenant and return the reason — abuse and runaway loops stop at a known cost'
code: |
  import hashlib

  class TokenBucket:
      def __init__(self, cap, rate, now):
          self.cap, self.rate = cap, rate
          self.tokens, self.t = cap, now
      def take(self, n, now):
          refill = (now - self.t) * self.rate
          self.tokens = min(self.cap, self.tokens + refill)
          self.t = now
          if n <= self.tokens:
              self.tokens -= n
              return True
          return False

  class Meter:
      def __init__(self, price_1k, cost_1k):
          self.price, self.cost = price_1k, cost_1k
          self.events = {}
      def record(self, event_id, tenant, tokens):
          if event_id in self.events:    # a retry: already billed
              return False
          self.events[event_id] = (tenant, tokens)
          return True
      def tokens(self, tenant):
          return sum(n for t, n in self.events.values() if t == tenant)
      def invoice(self, tenant):
          return self.tokens(tenant) / 1000 * self.price
      def margin(self, tenant):
          spend = self.tokens(tenant) / 1000 * self.cost
          return self.invoice(tenant) - spend

  def cache_key(tenant, prompt):
      return tenant + ":" + hashlib.sha256(prompt.encode()).hexdigest()

  class Gateway:
      def __init__(self, keys, plans, meter, clock):
          self.keys, self.plans = keys, plans
          self.meter, self.clock = meter, clock
          self.buckets, self.daily, self.cache = {}, {}, {}
          self.model_calls = 0
      def authenticate(self, api_key):
          return self.keys.get(api_key)     # (tenant, plan) or None
      def handle(self, api_key, req):
          who = self.authenticate(api_key)
          if who is None:
              return dict(status=401, reason="invalid key")
          tenant, plan = who
          p, now = self.plans[plan], self.clock()
          day = (tenant, int(now // 86400))
          if self.daily.get(day, 0) >= p["daily"]:
              return dict(status=429, reason="daily cap")
          b = self.buckets.setdefault(
              tenant, TokenBucket(p["cap"], p["rate"], now))
          if not b.take(req["max_tokens"], now):
              return dict(status=429, reason="rate limited")
          ck = cache_key(tenant, req["prompt"])
          if ck not in self.cache:          # stub model, scripted
              self.model_calls += 1
              n = len(req["prompt"].split()) + 5
              self.cache[ck] = ("ans:" + req["prompt"], n)
          answer, tokens = self.cache[ck]
          if self.meter.record(req["id"], tenant, tokens):
              self.daily[day] = self.daily.get(day, 0) + tokens
          return dict(status=200, answer=answer, tokens=tokens)
