id: tree-ensembles
name: Tree ensembles
order: 4
summary: Combine many shallow or randomised decision trees by averaging (bagging)
  or by fitting residuals (boosting).
when_to_use:
- Tabular data with mixed feature types and interactions.
- You want strong accuracy with little preprocessing.
- Features are on different scales or have outliers.
key_idea: One tree is high variance, so average many decorrelated trees (random
  forest) or add small trees that each correct the previous errors (boosting). Bagging
  cuts variance, boosting cuts bias.
template: |
  import numpy as np

  def bagging_predict(trees, X):
      return np.mean([t(X) for t in trees], axis=0)

  def boosting_fit(X, y, fit_tree, rounds, lr):
      pred, trees = np.zeros(len(y)), []
      for _ in range(rounds):
          tree = fit_tree(X, y - pred)       # fit the residual
          pred += lr * tree(X)
          trees.append(tree)
      return trees
complexity: Fit O(T·n·d·log n); predict O(T·depth).
pitfalls:
- Boosting overfits noisy labels without early stopping.
- Trees cannot extrapolate beyond the training range.
problems:
- decision-tree
- random-forest
- gradient-boosting
- adaboost
aliases:
- Tree ensembles
