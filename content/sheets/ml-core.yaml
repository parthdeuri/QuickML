id: ml-core
name: ML Core
description: Core classical machine learning, evaluation and the math behind them.
sections:
- name: Foundations
  problems:
  - gradient-descent
  - bayes-theorem
  - maximum-likelihood
  - entropy-kl-divergence
  - metropolis-hastings
- name: Regression
  problems:
  - linear-regression
  - ridge-lasso-regularization
  - gaussian-process-regression
  - elastic-net-coordinate-descent
- name: Classification
  problems:
  - logistic-regression
  - naive-bayes
  - knn
  - svm
  - decision-tree
  - linear-discriminant-analysis
  - kernel-trick-rbf
- name: Ensembles
  problems:
  - random-forest
  - gradient-boosting
  - adaboost
- name: Sequences and recommenders
  problems:
  - hidden-markov-forward
  - matrix-factorization-recommender
- name: Unsupervised
  problems:
  - k-means
  - gaussian-mixture-em
  - dbscan
  - pca
  - hierarchical-clustering
  - local-outlier-factor
  - nmf-multiplicative-updates
- name: Preprocessing and linear algebra
  problems:
  - feature-scaling
  - svd
- name: Evaluation and generalisation
  problems:
  - bias-variance-tradeoff
  - cross-validation
  - precision-recall-f1
  - roc-auc
  - class-imbalance
  - probability-calibration
  - hyperparameter-search
  - data-leakage
  - multiclass-metrics
