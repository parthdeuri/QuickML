slug: llm-cost-latency-optimisation
title: LLM Cost and Latency Optimisation
url: https://arxiv.org/abs/2305.05176
difficulty: Medium
area: MLOps
topics: [LLM, Cost, Latency, Caching, Routing]
summary: |
  Treat an LLM request as arithmetic: cost is tokens times price, and
  latency is time to first token plus output length times inter-token
  time. Optimise by caching shared prefixes, cascading cheap models,
  and shortening outputs.
intuition: |
  Both bills scale with tokens, but not equally: output tokens are
  priced higher and are generated one at a time, so $n_{out}$ dominates
  latency while a long shared prompt dominates input cost. That tells
  you where to push: reuse the part of the prompt that repeats, send
  easy requests to a small model and escalate only the hard ones, and
  cut output length first. Streaming does not shorten the total time,
  it only moves the first visible token earlier.
  Flow: request → cache or cheap model first → escalate if needed → stream tokens.
approach:
  - "Price one request as $n_{in}p_{in} + n_{out}p_{out}$ — the baseline every lever is compared with"
  - "Model latency as $t_{ttft} + n_{out}t_{itl}$ — shows that output length is the main latency term"
  - "Bill a cached prefix at fraction $d$ on hit rate $h$ — only the repeated part of the prompt gets cheaper"
  - "Cascade with escalation rate $e$, expected cost $c_1 + e\\,c_2$ — pays the big model only on hard requests"
  - "Check $c_1 < (1-e)\\,c_2$ before adopting the cascade — a bad router costs more than it saves"
code: |
  def request_cost(n_in, n_out, p_in, p_out):
      return n_in * p_in + n_out * p_out

  def request_latency(ttft, itl, n_out):
      decode = n_out * itl
      return ttft + decode

  def prefix_cache_cost(n_prefix, n_new, n_out,
                        p_in, p_out, discount, hit_rate):
      rate = hit_rate * discount + (1 - hit_rate)
      prefix = n_prefix * p_in * rate
      return prefix + n_new * p_in + n_out * p_out

  def cascade_expected_cost(c1, c2, e):
      escalated = e * c2
      return c1 + escalated

  def cascade_is_cheaper(c1, c2, e):
      headroom = (1 - e) * c2
      return c1 < headroom
key_lines: [5, 10, 19]
time: "O(1) arithmetic per request; the savings come from fewer billed tokens, not faster code"
space: "O(1) for the formulas; a prefix cache stores the prefix state on the provider side"
when_to_use: |
  Sizing and budgeting an LLM feature, or deciding which lever (prefix
  caching, a model cascade, shorter outputs, streaming, offline
  batching) is worth building before you build it.
when_not_to_use: |
  Do not optimise cost blindly when quality is the bottleneck: a
  cascade that escalates too rarely or a truncated answer can lose
  more value than the tokens saved. Prices and latencies here are
  illustrative parameters, so measure your own.
why_it_works: |
  Cost is linear in token counts, so any lever that removes billed
  tokens or replaces a price with a lower one helps in proportion to
  its share of the bill. The cascade is an expectation: every request
  pays $c_1$, and a fraction $e$ also pays $c_2$, so it beats always
  calling the big model exactly when $c_1 + e\,c_2 < c_2$.
math:
  - "C = n_in·p_in + n_out·p_out"
  - "L = t_ttft + n_out·t_itl"
  - "C_prefix = n_p·p_in·(h·d + 1 − h)"
  - "Saved by prefix cache = h·(1 − d)·n_p·p_in"
  - "E[C_cascade] = c₁ + e·c₂"
  - "Cascade cheaper than always c₂ iff c₁ < (1 − e)·c₂"
  - "Equivalently e < 1 − c₁/c₂"
interview_qa:
  - q: "Why does output length dominate latency?"
    a: "Tokens are generated one at a time, so total decode time is $n_{out}$ times the inter-token time, while the prompt is processed in one parallel pass that only sets the time to first token."
  - q: "When does a model cascade save money?"
    a: "When the cheap model's cost $c_1$ is below $(1-e)\\,c_2$, where $e$ is the fraction escalated to the big model. A high escalation rate or an expensive first stage removes the saving."
  - q: "Does streaming make a response faster?"
    a: "Total latency is unchanged. Streaming only shows the first token after the time to first token, so the perceived wait shrinks."
  - q: "What does prefix caching help with?"
    a: "Prompts that start with the same long system text or documents. Only the repeated prefix is billed at the discount, so the gain scales with the prefix share and the hit rate."
hyperparameters:
  - "Cached-token billing fraction $d$ and expected hit rate $h$"
  - "Escalation probability $e$ of the router"
  - "Output length cap $n_{out}$"
  - "Time to first token and inter-token time of each model"
pitfalls:
  - "Counting the cascade saving without including the cost of calling the router or judging the first answer"
  - "Assuming a prefix cache hits on text that changes early; the cached part must be an identical leading prefix"
  - "Optimising average cost while ignoring tail latency and the extra delay when a request escalates"
related: [context-engineering, gpu-memory-estimation, continuous-batching]
math_tex:
- 'Cost: $C = n_{in}p_{in} + n_{out}p_{out}$'
- 'Latency: $L = t_{ttft} + n_{out}\,t_{itl}$'
- 'Prefix: $C = n_p p_{in}(hd + 1 - h)$'
- 'Saved: $h(1-d)\,n_p\,p_{in}$'
- 'Cascade: $\mathbb{E}[C] = c_1 + e\,c_2$'
- 'Cheaper iff $c_1 < (1-e)\,c_2$'
- 'Equivalently $e < 1 - \frac{c_1}{c_2}$'
