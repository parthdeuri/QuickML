id: compare-vae-vs-gan
name: 'Compare: VAE vs GAN'
order: 109
summary: Both generate data from noise; a VAE trains with a likelihood bound, a
  GAN trains a generator against a discriminator.
when_to_use:
- Pick a VAE when you need a smooth latent space and stable training.
- Pick a GAN when sharp, realistic samples matter more than stability.
- Pick a VAE when you also need to encode real data into latents.
key_idea: A VAE is trained by reconstruction plus a KL term, so it has a clear loss
  to minimise but tends to give blurry samples. A GAN has no likelihood; the generator
  improves only by fooling a discriminator, which gives sharp samples but an unstable
  two-player game.
template: |
  import numpy as np

  def vae_loss(x, xhat, mu, logvar):
      rec = ((x - xhat) ** 2).sum()
      kl = -0.5 * (1 + logvar - mu ** 2 - np.exp(logvar)).sum()
      return rec + kl

  def gan_d_loss(d_real, d_fake):      # probabilities in (0, 1)
      return -(np.log(d_real) + np.log(1 - d_fake)).mean()
complexity: Both need many training steps; GANs also need careful balancing of two
  networks.
pitfalls:
- GANs can collapse to a few modes.
- VAE samples blur when the decoder noise model is too simple.
problems:
- vae-reparameterization
- gan-minimax-loss
- autoencoder
aliases:
- 'Compare: VAE vs GAN'
