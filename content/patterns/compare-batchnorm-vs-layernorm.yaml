id: compare-batchnorm-vs-layernorm
name: 'Compare: Batch norm vs Layer norm'
order: 102
summary: Both normalise activations; batch norm uses statistics across the batch,
  layer norm across the features of one example.
when_to_use:
- Pick batch norm for convolutional networks with reasonably large batches.
- Pick layer norm for transformers and recurrent models, or when batches are tiny
  or vary.
- Pick layer norm when training and evaluation behaviour must be identical.
key_idea: The only difference is the axis the mean and variance are taken over.
  Batch norm needs the other examples in the batch, so it keeps running averages
  for evaluation. Layer norm looks at a single example, so it behaves the same in
  training and evaluation.
template: |
  import numpy as np

  def batch_norm(x, eps=1e-5):          # x: (batch, features)
      mu, var = x.mean(0), x.var(0)       # over the batch
      return (x - mu) / np.sqrt(var + eps)

  def layer_norm(x, eps=1e-5):
      mu = x.mean(1, keepdims=True)       # over the features
      var = x.var(1, keepdims=True)
      return (x - mu) / np.sqrt(var + eps)
complexity: Both are O(n·d); batch norm also stores running statistics.
pitfalls:
- Batch norm degrades with very small batches.
- In evaluation mode batch norm must use running statistics, not the batch's.
problems:
- batch-normalization
- layer-normalization
aliases:
- 'Compare: Batch norm vs Layer norm'
