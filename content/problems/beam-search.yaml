slug: beam-search
title: Beam Search Decoding
url: https://huggingface.co/blog/how-to-generate
difficulty: Medium
area: NLP
topics: [Decoding, Sequence Generation, Search]
summary: |
  Generate a sequence by keeping the B highest-scoring partial sequences
  at every step instead of committing to a single best token.
intuition: |
  Greedy decoding can take a locally best token that leads to a poor
  continuation, while checking every sequence is exponential. Beam
  search is the compromise: a small frontier of the best prefixes is
  extended and pruned each step, so a good path that starts with a
  second-best token can still survive.
why_it_works: |
  The score of a sequence is the sum of per-token log-probabilities, so
  extending a prefix only adds terms. Keeping the top B prefixes is
  exact whenever B is at least the number of prefixes at that depth,
  which makes beam width a smooth dial between greedy search and
  exhaustive search. For smaller B it is only a heuristic.
when_to_use: |
  Machine translation, summarisation and speech recognition, where the
  single most probable output is wanted and the model is well
  calibrated.
when_not_to_use: |
  Open-ended generation, where beam search tends to give repetitive,
  generic text; sampling is preferred there. It also gives no guarantee
  of finding the true best sequence.
math:
  - "Score(y₁..y_T) = Σₜ log p(yₜ | y₁..yₜ₋₁)"
  - "Beams at step t: top B of {(y, y+w) : y in beams, w in vocab}"
  - "Candidates per step: B · |V|"
  - "B = 1 gives greedy decoding"
  - "B ≥ |V|^T keeps every prefix, so the result is exact search"
approach:
  - "Start with one beam holding only the start token and score zero — the initial frontier"
  - "Ask the model for next-token log-probabilities of each beam — gives all one-token extensions"
  - "Add each log-probability to its beam's score — scores of sequences are additive"
  - "Sort all B·|V| candidates and keep the best B — prunes the exponential tree"
  - "Repeat for the target length and return the top beam — highest total log-probability found"
code: |
  import numpy as np

  def beam_search(step, bos, L, B):
      beams = [([bos], 0.0)]
      for _ in range(L):
          cand = []
          for seq, sc in beams:
              lp = step(seq)
              for t in range(len(lp)):
                  cand.append((seq + [t], sc + lp[t]))
          cand.sort(key=lambda c: -c[1])
          beams = cand[:B]
      return beams
key_lines: [10, 11, 12]
time: "O(L · B · |V| · log(B·|V|)) plus L·B model calls"
space: "O(B · L) for the stored beams"
hyperparameters:
  - "Beam width B (larger is closer to exact search but slower)"
  - "Length penalty (sum of log-probs favours short outputs)"
  - "Maximum length and end-of-sequence handling"
  - "n-gram repetition blocking"
pitfalls:
  - "Raw summed log-probability prefers short sequences; normalise or add a length penalty"
  - "This sketch decodes a fixed length and has no end-of-sequence token, which real decoders need"
  - "Beams often collapse to near-identical outputs; diverse beam search addresses this"
  - "A wider beam can lower quality in generation even though it raises model probability"
interview_qa:
  - q: "Is beam search optimal?"
    a: "No. It only keeps B prefixes, so the best full sequence can be pruned early. It is exact only when B covers all prefixes."
  - q: "What are greedy and exhaustive search as special cases?"
    a: "Beam width one is greedy. A width that never prunes is exhaustive search over all sequences."
  - q: "Why use log-probabilities?"
    a: "Products of many probabilities underflow, and sums of logs are numerically stable and additive over steps."
related: [softmax-cross-entropy, self-attention]
patterns: ["Text processing"]
