slug: mlp-forward-pass
title: MLP Forward Pass
url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html
difficulty: Easy
area: Deep Learning
topics: [Neural Networks, Linear Algebra, Initialisation]
summary: |
  Push a batch of inputs through a stack of affine layers with a
  non-linearity between them, ending in raw scores (logits).
intuition: |
  Each layer is one matrix multiply plus a bias that re-describes the
  data in a new feature space, and the activation bends that space so
  the next layer can separate what the last one could not. Handling the
  whole batch as a matrix turns many small dot products into a single
  fast operation.
why_it_works: |
  A hidden layer with enough units and a non-linearity can approximate
  any continuous function, and extra layers build features from
  features. He initialisation sets the weight variance from the fan-in
  so activations keep a stable scale as they pass through ReLU layers.
when_to_use: |
  Tabular data and as the building block inside larger models such as
  transformer feed-forward blocks and classifier heads.
when_not_to_use: |
  Not ideal for images or sequences where structure matters (use
  convolution or attention), since an MLP ignores locality and order and
  needs many more parameters.
math:
  - "zₗ = aₗ₋₁Wₗ + bₗ   (rows are samples)"
  - "aₗ = ReLU(zₗ) for hidden layers, a₀ = X"
  - "Output layer: logits = z_L, no activation"
  - "Probabilities: softmax(logits) row-wise"
  - "He init: Wₗ ~ N(0, 2 / fan_in), bₗ = 0"
  - "Parameters: Σₗ (mₗ·nₗ + nₗ)"
approach:
  - "Initialise each weight matrix with std √(2 / fan_in) and zero biases — keeps activation scale stable through ReLU"
  - "Set a = X with one row per sample — the whole batch moves together"
  - "Compute z = aW + b for each layer — a learned affine re-mapping"
  - "Apply ReLU on hidden layers but not the last — the output stays as unbounded logits"
  - "Apply softmax to logits only when probabilities are needed — losses usually take logits directly"
code: |
  import numpy as np

  def init_mlp(sizes, rng):
      return [(rng.normal(0, np.sqrt(2 / m), (m, n)), np.zeros(n))
              for m, n in zip(sizes[:-1], sizes[1:])]

  def forward(layers, X):
      a = X
      for i, (W, b) in enumerate(layers):
          z = a @ W + b
          a = z if i == len(layers) - 1 else np.maximum(0, z)
      return a

  def softmax(z):
      e = np.exp(z - z.max(axis=1, keepdims=True))
      return e / e.sum(axis=1, keepdims=True)
key_lines: [4, 10, 11]
time: "O(batch · Σ mₗ·nₗ) multiply-adds"
space: "O(Σ mₗ·nₗ) for weights plus O(batch · widest layer) for activations"
hyperparameters:
  - "Layer sizes (depth and width)"
  - "Activation function (ReLU, GELU, tanh)"
  - "Weight initialisation scheme (He for ReLU, Xavier for tanh)"
pitfalls:
  - "Using a weight layout of (out, in) in one place and (in, out) in another gives silent shape bugs"
  - "Zero or all-equal weight init makes every unit in a layer identical"
  - "Adding an activation after the final layer distorts logits for most losses"
  - "Without biases the layer cannot shift its output"
interview_qa:
  - q: "What happens if you remove all activations?"
    a: "The network collapses to a single linear map, whatever the depth."
  - q: "Why initialise weights randomly rather than at zero?"
    a: "Zero weights give every unit in a layer the same output and gradient, so they never differentiate."
  - q: "Why scale init by fan-in?"
    a: "It keeps the variance of activations and gradients roughly constant across layers, avoiding vanishing or exploding signals."
related: [backpropagation, activation-functions, softmax-cross-entropy]
patterns: ["Network building blocks"]
