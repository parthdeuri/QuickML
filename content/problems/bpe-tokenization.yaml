time: "O(k · corpus length) for training, O(k · word length) per encoded word"
space: "O(corpus length) for the working symbol sequences"
hyperparameters:
  - "Number of merges k (sets vocabulary size)"
  - "Tie-breaking rule for equally frequent pairs"
  - "Pre-tokenisation (whitespace or regex split before BPE)"
  - "Byte-level versus character-level base alphabet"
pitfalls:
  - "Recounting all pairs each merge is slow for big corpora; real code updates counts incrementally"
  - "Without word-boundary markers a merge can cross word edges or lose where words end"
  - "This sketch ignores word frequencies by taking a plain list of words, so repeats are counted by listing them"
  - "Different tie-breaking gives different but equally valid vocabularies"
interview_qa:
  - q: "How does BPE avoid unknown tokens?"
    a: "Its base alphabet is single characters, or bytes in byte-level BPE, so any word can be spelled out even if no merge applies."
  - q: "How do you encode a new word?"
    a: "Start from characters and apply the learned merges in the order they were learned, not by frequency in the new text."
  - q: "How is BPE different from WordPiece?"
    a: "BPE merges the most frequent pair. WordPiece picks the merge that most increases the likelihood of the training data under a language model."
