slug: sentencepiece-unigram
title: SentencePiece Unigram Tokenisation
url: https://huggingface.co/learn/llm-course/chapter6/7
difficulty: Hard
area: NLP
topics: [Tokenisation, Subwords, Language Modeling]
summary: |
  Give every token a probability and segment a word with the split that
  maximises the sum of token log-probabilities, found by Viterbi. Train by
  starting from a large vocabulary, fitting probabilities with EM and
  pruning the tokens whose removal costs the least likelihood.
intuition: |
  BPE and WordPiece build a vocabulary by adding merges. Unigram goes the
  other way: it keeps a probabilistic model of the text and deletes the
  tokens it does not need. Because every segmentation has a probability,
  tokenisation is a best-path search, and the ambiguity can even be
  sampled. SentencePiece also treats text as a raw character stream, with
  the space turned into a visible marker such as "▁", so no language-specific
  pre-tokeniser is needed.
  Flow: big vocabulary → EM probabilities → prune weakest → Viterbi segment.
approach:
  - "Start with a large vocabulary of frequent substrings plus all single characters — characters guarantee every word can be segmented"
  - "Give each token a probability $p(t)$ — a segmentation scores $\\sum \\log p(t)$"
  - "E step: use forward and backward sums over the lattice to get the expected count of each token — all segmentations count, weighted by probability"
  - "M step: set $p(t)$ proportional to its expected count — this never lowers the corpus likelihood"
  - "Prune the tokens whose removal raises the loss least, never the characters — shrinks the vocabulary towards the target size"
  - "Segment with Viterbi over positions: best score ending at each position — exact in $O(L^2)$ lookups"
code: |
  import numpy as np

  def viterbi_segment(word, logp):
      n = len(word)
      best = [0.0] + [-np.inf] * n
      back = [0] * (n + 1)
      for j in range(1, n + 1):
          for i in range(j):
              s = word[i:j]
              if s in logp and best[i] + logp[s] > best[j]:
                  best[j] = best[i] + logp[s]
                  back[j] = i
      if best[n] == -np.inf:
          return None, best[n]
      out, j = [], n
      while j > 0:
          out.append(word[back[j]:j])
          j = back[j]
      return out[::-1], best[n]

  def lattice(word, p):
      n = len(word)
      a = [1.0] + [0.0] * n
      b = [0.0] * n + [1.0]
      for j in range(1, n + 1):
          for i in range(j):
              a[j] += a[i] * p.get(word[i:j], 0.0)
      for i in range(n - 1, -1, -1):
          for j in range(i + 1, n + 1):
              b[i] += p.get(word[i:j], 0.0) * b[j]
      return a, b

  def em_step(freqs, p):
      cnt = dict.fromkeys(p, 0.0)
      ll = 0.0
      for w, f in freqs.items():
          a, b = lattice(w, p)
          ll += f * np.log(a[-1])
          for i in range(len(w)):
              for j in range(i + 1, len(w) + 1):
                  s = w[i:j]
                  if s in p:
                      cnt[s] += f * a[i] * p[s] * b[j] / a[-1]
      tot = sum(cnt.values())
      return {s: c / tot for s, c in cnt.items()}, ll
