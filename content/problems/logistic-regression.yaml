slug: logistic-regression
title: Logistic Regression
url: https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression
difficulty: Easy
area: Classical ML
topics: [Classification, Supervised, Maximum Likelihood]
summary: |
  Classify by passing a linear score through a sigmoid to get a
  probability, then fit the weights by maximising the data likelihood.
intuition: |
  The model is a linear model for the log-odds, so each feature adds or
  subtracts a fixed amount of evidence and the sigmoid just turns that
  evidence into a probability. The decision boundary stays a flat
  hyperplane, but the loss now punishes confident wrong answers heavily.
why_it_works: |
  The negative log-likelihood of Bernoulli labels is convex in the
  weights, so there is one global minimum and no bad local optima. Its
  gradient has the same shape as in linear regression, $(p-y)$ in place
  of the residual, which is why Newton steps or gradient descent both
  converge reliably.
when_to_use: |
  A strong, well-calibrated baseline for binary classification when you
  want interpretable weights (log-odds per feature) and fast training.
when_not_to_use: |
  Skip it when the classes are separated by a clearly curved boundary
  and you cannot add features for it, or when classes are perfectly
  separable and you have no regularisation (the weights diverge).
math:
  - "p = σ(z), z = wᵀx + b, σ(z) = 1 / (1 + e⁻ᶻ)"
  - "log(p / (1 − p)) = wᵀx + b"
  - "L(w) = −(1/n) Σ [y·log p + (1 − y)·log(1 − p)]"
  - "∇L = (1/n) · Xᵀ(p − y)"
  - "Hessian H = (1/n) · Xᵀ diag(p(1 − p)) X"
  - "Newton step: w ← w − H⁻¹ ∇L"
approach:
  - "Add a ones column to $X$ — so the bias is just another weight"
  - "Start at $w = 0$ — the loss is convex, so any start reaches the optimum"
  - "Compute $p = \\sigma(Xw)$ and the gradient $X^{\\top}(p-y)$ — this is the direction of error"
  - "Build the Hessian with weights $p(1-p)$ — it gives curvature for a Newton step"
  - "Solve $H\\cdot\\Delta = g$ and update $w$ — a few steps usually converge"
code: |
  import numpy as np

  def sigmoid(z):
      return 1 / (1 + np.exp(-z))

  def fit(X, y, iters=25):
      A = np.c_[np.ones(len(X)), X]
      w = np.zeros(A.shape[1])
      for _ in range(iters):
          p = sigmoid(A @ w)
          g = A.T @ (p - y)
          H = (A.T * (p * (1 - p))) @ A
          w -= np.linalg.solve(H, g)
      return w

  def predict_proba(w, X):
      return sigmoid(np.c_[np.ones(len(X)), X] @ w)
key_lines: [11, 12, 13]
time: "O(iters · n·d² + d³) with Newton; O(n·d) per step with gradient descent"
space: "O(d²) for the Hessian, O(n·d) for the data"
hyperparameters:
  - "Regularisation strength $C$ (smaller $C$ means stronger L2 penalty)"
  - "Penalty type (L1 for sparse weights, L2 for shrinkage)"
  - "Decision threshold (default 0.5, tune for precision/recall trade-off)"
  - "Solver and max iterations (Newton, L-BFGS, SGD)"
pitfalls:
  - "Perfectly separable data makes the weights grow without bound unless regularised"
  - "Unscaled features slow gradient-based solvers and make L2 uneven"
  - "Probabilities are only calibrated if the linear log-odds assumption holds"
  - "Plain exp overflows for large negative $z$; production code uses a stable sigmoid"
interview_qa:
  - q: "Why cross-entropy loss and not squared error?"
    a: "Cross-entropy is the Bernoulli negative log-likelihood and is convex in $w$; squared error on a sigmoid is non-convex and gives vanishing gradients when wrong."
  - q: "How do you read a coefficient?"
    a: "Increasing that feature by one unit multiplies the odds by $\\exp(\\mathrm{coefficient})$, holding the others fixed."
  - q: "Is logistic regression a linear classifier?"
    a: "Yes. The boundary $\\sigma(z) = 0.5$ is $w^{\\top}x + b = 0$, a hyperplane."
related: [linear-regression, gradient-descent, softmax-cross-entropy]
math_tex:
- $p = \sigma(z),\ z = w^{\top}x + b,\ \sigma(z) = \frac{1}{1 + e^{-z}}$
- $\log\frac{p}{1-p} = w^{\top}x + b$
- $L(w) = -\frac{1}{n}\sum\,[\,y\log p + (1-y)\log(1-p)\,]$
- $\nabla L = \frac{1}{n}\,X^{\top}(p - y)$
- Hessian $H = \frac{1}{n}\,X^{\top}\,\mathrm{diag}(p(1-p))\,X$
- 'Newton step: $w \leftarrow w - H^{-1}\nabla L$'
