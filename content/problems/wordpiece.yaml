slug: wordpiece
title: WordPiece Subword Tokenisation
url: https://huggingface.co/learn/llm-course/chapter6/6
difficulty: Medium
area: NLP
topics: [Tokenisation, Subwords, BERT]
summary: |
  Split a word greedily into the longest vocabulary pieces, marking every
  non-initial piece with $\#\#$. Training merges the pair with the highest
  $\mathrm{freq}(ab)/(\mathrm{freq}(a)\,\mathrm{freq}(b))$, not the most frequent pair.
intuition: |
  BPE merges whatever pair is most common, which favours pairs made of
  very frequent pieces that would often appear together anyway. WordPiece
  divides by the frequencies of the two parts, so it prefers pairs that
  occur together far more often than chance, which is close to the
  likelihood gain of adding the merged token. At inference only the final
  vocabulary is kept and the word is cut by longest match, with $\#\#$
  marking a piece that continues a word.
  Flow: characters → pair scores → best merge → vocabulary → longest match.
approach:
  - "Start from single characters, with $\\#\\#$ on every non-initial one — the base alphabet can spell any known word"
  - "Count each token and each adjacent pair, weighted by word frequency — the score needs both"
  - "Score each pair as $\\mathrm{freq}(ab)/(\\mathrm{freq}(a)\\,\\mathrm{freq}(b))$ — rewards association, not raw popularity"
  - "Merge the best pair into one token in every word — the merged token joins the vocabulary"
  - "Repeat until the vocabulary reaches the target size — only the vocabulary is kept"
  - "Tokenise by taking the longest matching prefix, then continuing with $\\#\\#$ — if no piece matches, the whole word is [UNK]"
code: |
  from collections import Counter

  def wordpiece_tokenize(word, vocab):
      out, start = [], 0
      while start < len(word):
          end = len(word)
          while end > start:
              s = word[start:end]
              if start > 0:
                  s = "##" + s
              if s in vocab:
                  break
              end -= 1
          if end == start:
              return ["[UNK]"]
          out.append(s)
          start = end
      return out

  def split_word(w):
      return [w[0]] + ["##" + c for c in w[1:]]

  def pair_stats(splits, freqs):
      one, two = Counter(), Counter()
      for w, toks in splits.items():
          for t in toks:
              one[t] += freqs[w]
          for p in zip(toks, toks[1:]):
              two[p] += freqs[w]
      return one, two

  def best_pair(splits, freqs, use_score=True):
      one, two = pair_stats(splits, freqs)
      if not use_score:
          return max(two, key=two.get)
      return max(two, key=lambda p:
                 two[p] / (one[p[0]] * one[p[1]]))

  def merge(splits, pair):
      a, b = pair
      new = a + (b[2:] if b.startswith("##") else b)
      out = {}
      for w, toks in splits.items():
          r, i = [], 0
          while i < len(toks):
              if tuple(toks[i:i + 2]) == pair:
                  r.append(new)
                  i += 2
              else:
                  r.append(toks[i])
                  i += 1
          out[w] = r
      return out
