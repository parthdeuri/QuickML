slug: hidden-markov-forward
title: Hidden Markov Model (Forward Algorithm)
url: https://en.wikipedia.org/wiki/Forward_algorithm
difficulty: Medium
area: Classical ML
topics: [Sequence Models, Probabilistic, Dynamic Programming, HMM]
summary: |
  Compute the likelihood of an observation sequence under a hidden Markov
  model by carrying a running belief over hidden states. Dynamic
  programming turns a sum over exponentially many state paths into one
  pass.
intuition: |
  The brute-force likelihood adds up the probability of every possible
  hidden path, which grows exponentially with sequence length. But the
  future depends on the past only through the current state, so all paths
  that end in the same state can be merged into one number. The forward
  vector stores exactly that merged mass per state, and each new
  observation costs one small matrix-vector product.
why_it_works: |
  The Markov property makes the probability of the next state and symbol
  depend only on the current state, so the joint sum factorises into
  nested sums that can be pushed inside each other (the distributive law).
  The forward variable αₜ(j) is the partial sum over all paths ending in
  state j. Rescaling αₜ to sum to one at each step avoids numerical
  underflow, and the log of the scale factors adds up to the exact log
  likelihood.
when_to_use: |
  Scoring a sequence under a fitted HMM (speech, gesture, biological
  sequences, regime switching), model comparison between HMMs, and as the
  E-step ingredient of Baum-Welch training.
when_not_to_use: |
  When the state or observation dependence is long-range (use RNNs or
  transformers), when states are continuous and non-linear, or when you
  need the single best state path rather than a likelihood (that is the
  Viterbi algorithm, which replaces the sum by a max).
math:
  - "Model: λ = (π, A, B), Aᵢⱼ = P(zₜ₊₁=j | zₜ=i), Bⱼ(o) = P(o | z=j)"
  - "Likelihood: P(o₁:T) = Σ over paths z₁:T of π(z₁) B(z₁,o₁) Π A B"
  - "Init: α₁(j) = πⱼ Bⱼ(o₁)"
  - "Recursion: αₜ₊₁(j) = [ Σᵢ αₜ(i) Aᵢⱼ ] Bⱼ(oₜ₊₁)"
  - "Result: P(o₁:T) = Σⱼ α_T(j)"
  - "Scaling: cₜ = Σⱼ α̃ₜ(j) before normalising; log P = Σₜ log cₜ"
  - "Cost: O(T·N²) instead of O(N^T) for the path sum"
approach:
  - "Start with α = π ⊙ B[:, o₁] — the joint probability of each first state and the first symbol"
  - "Normalise α by its sum c and store log c — keeps numbers near one so long sequences do not underflow"
  - "Propagate with α @ A — pushes the belief one step through the transition matrix, summing over previous states"
  - "Multiply by the emission column for the new symbol — conditions the belief on what was just observed"
  - "Rescale again and add log c to the running total — the scale factors multiply to the true likelihood"
  - "Return the accumulated log-likelihood — comparable across models for the same sequence"
code: |
  import numpy as np

  def forward(pi, A, B, obs):
      alpha = pi * B[:, obs[0]]
      c = alpha.sum()
      alpha, ll = alpha / c, np.log(c)
      for o in obs[1:]:
          alpha = (alpha @ A) * B[:, o]
          c = alpha.sum()
          alpha = alpha / c
          ll += np.log(c)
      return ll
key_lines: [8, 9, 11]
time: "O(T·N²) for T observations and N hidden states"
space: "O(N) for the running vector (O(T·N) if all αₜ are kept for smoothing)"
hyperparameters:
  - "Number of hidden states N — chosen by BIC or held-out likelihood"
  - "Initial distribution π, transition matrix A, emission matrix B — learned with Baum-Welch (EM)"
  - "Emission family — discrete table here, Gaussian or mixture for continuous data"
pitfalls:
  - "Without rescaling or log-space, the raw forward probabilities underflow on long sequences"
  - "This code handles discrete emissions with a fixed model; training the parameters needs the backward pass too (Baum-Welch)"
  - "Zero entries in A or B make some sequences impossible, so smooth estimated parameters"
  - "Forward gives the likelihood, not the best state sequence; use Viterbi for decoding"
interview_qa:
  - q: "Why is the forward algorithm polynomial when the path sum is exponential?"
    a: "Paths ending in the same state share an identical future, so their probabilities can be merged into one value per state; each step then costs N² work instead of multiplying the number of paths by N."
  - q: "How does Viterbi differ from the forward algorithm?"
    a: "Forward sums over predecessor states to get a likelihood; Viterbi takes a max and keeps back-pointers to recover the single most probable state path."
  - q: "How do you avoid underflow?"
    a: "Normalise the forward vector at every step and accumulate the log of the normalisers, or work fully in log-space with log-sum-exp."
  - q: "What is the forward pass used for in Baum-Welch?"
    a: "Together with the backward pass it gives the posterior probability of each state and transition at each time, which are the expected counts of the E-step."
