slug: ppo-clipped-objective
title: PPO Clipped Objective
url: https://arxiv.org/abs/1707.06347
difficulty: Hard
area: RL
topics: [Reinforcement Learning, Policy Gradient, Trust Region]
summary: |
  Improve a policy with several gradient steps on one batch of
  experience, while clipping the probability ratio so a step cannot move
  the new policy too far from the one that collected the data.
intuition: |
  Reusing a batch of data is efficient but dangerous: the further the
  policy moves from the one that generated the data, the less the
  advantages mean. PPO measures movement by the ratio of new to old
  action probability and stops rewarding progress once that ratio leaves
  a small band around one, in the direction the advantage wants. Taking
  the minimum of the clipped and unclipped terms makes the objective a
  pessimistic bound, so there is no incentive to push further, but a
  harmful move is still fully penalised.
why_it_works: |
  The ratio-weighted advantage is a first-order surrogate for the true
  improvement that is only valid near the sampling policy. Clipping
  removes the gradient where the ratio has already moved beyond the band
  in the favourable direction, which acts as a cheap trust region without
  the second-order machinery of TRPO. Where the policy moved the wrong
  way, the unclipped term is the smaller one and keeps its gradient, so
  mistakes can be corrected.
when_to_use: |
  On-policy deep RL and RLHF fine-tuning of language models, where
  stable updates with minimal tuning matter and rollouts are expensive
  to collect.
when_not_to_use: |
  When sample efficiency from off-policy replay is critical, or in
  settings with deterministic policies and continuous control tasks
  where off-policy methods such as SAC are preferred.
math:
  - "Ratio: ρ = π_new(a|s) / π_old(a|s) = exp(logp_new − logp_old)"
  - "Unclipped: ρ·Â"
  - "Clipped: clip(ρ, 1 − ε, 1 + ε)·Â"
  - "L_CLIP = mean[ min(ρ·Â, clip(ρ, 1 − ε, 1 + ε)·Â) ]"
  - "Loss to minimise = −L_CLIP"
  - "∂L_CLIP/∂logp_new = ρ·Â if the unclipped term is the min, else 0"
  - "Â > 0 : gradient stops once ρ > 1 + ε"
  - "Â < 0 : gradient stops once ρ < 1 − ε"
approach:
  - "Store log-probabilities of the sampled actions under the old policy — the fixed reference for the ratio"
  - "Compute the ratio exp(logp_new − logp_old) — how much the policy has moved on each sample"
  - "Form the unclipped term ρ·Â and the clipped term clip(ρ)·Â — the plain surrogate and its limited version"
  - "Take the elementwise minimum and average — a pessimistic bound with no reward for moving too far"
  - "Maximise it for a few epochs of minibatch gradient steps — reuse the batch safely"
code: |
  import numpy as np

  def ppo_clip_loss(logp_new, logp_old, adv, eps=0.2):
      ratio = np.exp(logp_new - logp_old)
      unclipped = ratio * adv
      clipped = np.clip(ratio, 1 - eps, 1 + eps) * adv
      obj = np.minimum(unclipped, clipped)
      # gradient flows only where the unclipped term is the minimum
      active = unclipped <= clipped
      grad = np.where(active, ratio * adv, 0.0) / len(adv)
      return -obj.mean(), -grad     # loss, dloss/dlogp_new
