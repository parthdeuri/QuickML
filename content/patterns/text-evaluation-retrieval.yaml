id: text-evaluation-retrieval
name: Text evaluation and retrieval
order: 22
summary: Score generated text against references and measure how well search puts
  relevant documents first.
when_to_use:
- You compare machine translation or summaries with references.
- You build search or retrieval-augmented generation.
- You need to rank documents and report a single quality number.
key_idea: 'Overlap metrics such as BLEU and ROUGE count shared n-grams, so they
  are cheap but blind to meaning. Retrieval metrics judge the ranked list: recall
  at k asks whether the answer was found, MRR rewards finding it early, and nDCG
  also values graded relevance.'
template: |
  import numpy as np

  def recall_at_k(ranked, relevant, k):
      return len(set(ranked[:k]) & set(relevant)) / len(relevant)

  def mrr(ranked, relevant):
      for i, d in enumerate(ranked, 1):
          if d in relevant:
              return 1 / i
      return 0.0
complexity: O(k) per query for recall and O(n) for MRR.
pitfalls:
- High n-gram overlap does not guarantee a correct or fluent answer.
- Retrieval scores depend on the quality of the relevance labels.
