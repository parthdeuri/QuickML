  - "For unit vectors: ‖â − b̂‖² = 2 − 2 cos(a, b)"
  - "Cosine distance = 1 − cos(a, b)"
interview_qa:
  - q: "Why use cosine similarity instead of the raw dot product?"
    a: "The dot product grows with vector length, so long vectors look similar to everything. Cosine removes length and compares direction only."
  - q: "Is cosine distance a true metric?"
    a: "No. 1 − cos can violate the triangle inequality. The angle itself is a metric, and the Euclidean distance between normalised vectors is too."
  - q: "How do you speed up cosine search over millions of vectors?"
    a: "Normalise once, then maximum inner product search with an approximate index works directly, since cosine becomes a dot product."
hyperparameters:
  - "Epsilon floor for zero-norm vectors"
  - "Number of neighbours k"
  - "Whether embeddings are pre-normalised"
pitfalls:
  - "Zero vectors divide by zero without the epsilon floor, and then give similarity 0"
  - "A cosine score is not calibrated; thresholds depend on the embedding model"
  - "Full argsort is O(n log n); real systems use partial selection or an approximate index"
related: [word2vec-skipgram, knn, pca]
patterns: ["Text processing"]
